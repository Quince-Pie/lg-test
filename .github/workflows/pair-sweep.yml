name: Capture Liquid Glass exhaustive pair sweep

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pair-sweep.yml
      - Sources/GlassPointSweep/**

concurrency:
  group: pair-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pair-sweep:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Select standard visual accessibility state
        run: |
          defaults write com.apple.universalAccess reduceTransparency -bool false
          defaults write com.apple.universalAccess reduceMotion -bool false
          defaults write com.apple.universalAccess increaseContrast -bool false
          killall cfprefsd 2>/dev/null || true

      - name: Build exhaustive pair sweep
        id: build
        continue-on-error: true
        run: |
          mkdir -p pair-sweep
          set -o pipefail
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            Sources/GlassPointSweep/main.swift \
            -o glass-pair-sweep 2>&1 |
            tee pair-sweep/build.log

      - name: Capture exhaustive pair sweep
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: ./glass-pair-sweep pair-sweep --pair-sweep

      - name: Inventory pair sweep
        if: always()
        run: |
          find pair-sweep -maxdepth 1 -type f -print -exec du -h {} \;

      - name: Upload pair sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-pair-sweep-${{ github.run_id }}
          path: pair-sweep
          if-no-files-found: error
          retention-days: 7

      - name: Enforce pair sweep
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test -s pair-sweep/manifest.json
