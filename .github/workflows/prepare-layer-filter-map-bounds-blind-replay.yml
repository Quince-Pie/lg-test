name: Blind exact prepare_layer FilterOp replay

on:
  workflow_dispatch:

concurrency:
  group: prepare-layer-filter-map-bounds-blind-replay-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter-map-bounds-blind-replay:
    name: ${{ matrix.label }}
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: blind-127-center
            geometry: circle-127-center
          - label: blind-128-center
            geometry: circle-128-center
          - label: blind-255-center
            geometry: circle-255-center
          - label: blind-257-center
            geometry: circle-257-center
          - label: blind-511-center
            geometry: circle-511-center
          - label: blind-512-center
            geometry: circle-512-center
          - label: blind-1023-center
            geometry: circle-1023-center
          - label: blind-1024-center
            geometry: circle-1024-center
    env:
      LG_GLASS_MATERIAL: clear
      LG_GLASS_APPEARANCE: light
      LG_GLASS_GEOMETRY: ${{ matrix.geometry }}
      LG_TRANSITION_TIMELINE: "1"
      LG_TRANSITION_DIRECTION: materialize
      LG_TRANSITION_UNIFORMS: "1"
      LG_TRANSITION_CONTROLLED_BACKDROP: "0"
      LG_TRANSITION_ALLOCATION_ONLY: "1"
      LG_TRANSITION_ALLOCATION_DENSE: "1"
      LG_TRANSITION_ALLOCATION_CALIBRATION: "0"
      LG_TRANSITION_ALLOCATION_MESH_CALIBRATION: "0"
      LG_TRANSITION_ALLOCATION_FIXED_STATE: "0"
      LG_TRANSITION_ALLOCATION_PATH_ISOLATION: "0"
      LG_TRANSITION_HIGHLIGHT_TRACE: "0"
      LG_TRANSITION_MATRIX_BASIS: "0"
      LG_PREPARE_LAYER_CROP_TRANSFER_TRACE_OUTPUT: >-
        transition-introspection/prepare-layer-crop-policy-holdout-trace.json
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Select standard visual accessibility state
        run: |
          defaults write com.apple.universalAccess reduceTransparency -bool false
          defaults write com.apple.universalAccess reduceMotion -bool false
          defaults write com.apple.universalAccess increaseContrast -bool false
          killall cfprefsd 2>/dev/null || true

      - name: Verify frozen blind-replay contracts
        id: contracts
        continue-on-error: true
        run: |
          mkdir -p transition-introspection
          set -o pipefail
          python3 -m unittest discover -s Analysis \
            -p 'test_capture_prepare_layer_crop_transfer_lldb_source.py' \
            -v 2>&1 | tee transition-introspection/contracts.log
          python3 -m unittest discover -s Analysis \
            -p 'test_validate_prepare_layer_crop_transfer.py' \
            -v 2>&1 | tee -a transition-introspection/contracts.log
          python3 -m unittest discover -s Analysis \
            -p 'test_capture_prepare_layer_crop_union_operand_lldb_source.py' \
            -v 2>&1 | tee -a transition-introspection/contracts.log
          python3 -m unittest discover -s Analysis \
            -p 'test_capture_prepare_layer_crop_policy_holdout_lldb_source.py' \
            -v 2>&1 | tee -a transition-introspection/contracts.log
          python3 -m unittest discover -s Analysis \
            -p 'test_capture_prepare_layer_crop_policy_holdout_callback_retry_lldb_source.py' \
            -v 2>&1 | tee -a transition-introspection/contracts.log
          python3 -m unittest discover -s Analysis \
            -p 'test_analyze_prepare_layer_crop_union_operand_matrix.py' \
            -v 2>&1 | tee -a transition-introspection/contracts.log
          python3 -m unittest discover -s Analysis \
            -p 'test_validate_prepare_layer_crop_policy_holdout.py' \
            -v 2>&1 | tee -a transition-introspection/contracts.log
          python3 -m unittest discover -s Analysis \
            -p 'test_analyze_prepare_layer_filter_map_bounds_exact_replay.py' \
            -v 2>&1 | tee -a transition-introspection/contracts.log
          python3 -m unittest discover -s Analysis \
            -p 'test_validate_prepare_layer_filter_map_bounds_blind_replay.py' \
            -v 2>&1 | tee -a transition-introspection/contracts.log
          python3 -m unittest discover -s Analysis \
            -p 'test_dynamic_allocation_prepare_layer_filter_map_bounds_blind_replay_preregistration.py' \
            -v 2>&1 | tee -a transition-introspection/contracts.log

      - name: Build transition introspection probe
        id: build
        if: steps.contracts.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p transition-introspection
          set -o pipefail
          xcrun clang \
            -std=c23 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -target "$(uname -m)-apple-macos26.0" \
            -c Sources/GlassIntrospect/MatrixBridge.c \
            -o transition-introspection/MatrixBridge.o 2>&1 |
            tee transition-introspection/build.log
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            -import-objc-header Sources/GlassIntrospect/MatrixBridge.h \
            Sources/GlassIntrospect/HalfBlendProbe.swift \
            Sources/GlassIntrospect/HalfDotProbe.swift \
            Sources/GlassIntrospect/HalfIntrinsicProbe.swift \
            Sources/GlassIntrospect/SDFStageProbe.swift \
            Sources/GlassIntrospect/main.swift \
            transition-introspection/MatrixBridge.o \
            -o glass-transition-introspect 2>&1 |
            tee -a transition-introspection/build.log

      - name: Capture target-output-blind FilterOp operands
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          xcrun lldb --batch \
            -o 'settings set target.output-path transition-introspection/runtime-stdout.log' \
            -o 'settings set target.error-path transition-introspection/runtime-stderr.log' \
            -o 'command script import Analysis/capture_prepare_layer_crop_policy_holdout_callback_retry_lldb.py' \
            -o run \
            -o 'script capture_prepare_layer_crop_policy_holdout_callback_retry_lldb.finalize()' \
            -- ./glass-transition-introspect transition-introspection \
            > transition-introspection/lldb-prepare-layer-filter-map-bounds-blind-replay.log 2>&1

      - name: Validate frozen exact FilterOp decoder
        id: blind_replay
        if: >-
          steps.build.outcome == 'success' &&
          steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          python3 Analysis/validate_prepare_layer_filter_map_bounds_blind_replay.py \
            transition-introspection/prepare-layer-crop-policy-holdout-trace.json \
            transition-introspection/transition-timeline.json \
            --expected-geometry '${{ matrix.geometry }}' \
            --output \
              transition-introspection/prepare-layer-filter-map-bounds-blind-replay-validation.json

      - name: Upload blind-replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            liquid-glass-filter-map-bounds-blind-${{ matrix.label }}-${{ github.run_id }}
          path: transition-introspection
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exact target-output-blind replay
        if: always()
        run: |
          test "${{ steps.contracts.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test "${{ steps.blind_replay.outcome }}" = success
          test -s transition-introspection/transition-timeline.json
          test -s transition-introspection/prepare-layer-crop-policy-holdout-trace.json
          test -s transition-introspection/prepare-layer-filter-map-bounds-blind-replay-validation.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("transition-introspection")
          result = json.loads(
              (root / "prepare-layer-filter-map-bounds-blind-replay-validation.json")
              .read_text(encoding="utf-8")
          )
          source = result.get("sourceBounds", {})
          replay = result.get("floatingReplay", {})
          selection = result.get("structuralSelection", {})
          sealed = result.get("sealedConclusion", {})
          if (
              result.get(
                  "prepareLayerFilterMapBoundsBlindReplayValidationSchemaVersion"
              ) != 1
              or result.get("conclusion") != "success"
              or result.get("expectedGeometry") != os.environ["LG_GLASS_GEOMETRY"]
              or source.get("sampleIndex") != 32
              or source.get("cropOrProducerValuesUsed") is not False
              or replay.get("rectangleCount") != 32
              or replay.get("componentCount") != 128
              or replay.get("exactRectangleCount") != 32
              or replay.get("exactComponentCount") != 128
              or replay.get("mismatchedRectangleCount") != 0
              or replay.get("mismatchedComponentCount") != 0
              or replay.get("maximumAbsoluteErrorsXYWH") != [0.0, 0.0, 0.0, 0.0]
              or replay.get("maximumULPDistancesXYWH") != [0, 0, 0, 0]
              or replay.get("toleranceUsed") is not False
              or replay.get("allRectanglesExact") is not True
              or replay.get("allComponentsExact") is not True
              or len(replay.get("records", [])) != 32
              or not all(record.get("exact") is True for record in replay["records"])
              or selection.get("cropOrProducerValuesUsedForSelection") is not False
              or selection.get("destinationMatchedUnionCount") != 64
              or selection.get("rejectedUnionCallCount") != 0
              or selection.get("rejectedStoreCount") != 0
              or sealed.get("terminalSourceBoundsDerivedWithoutCropValues") is not True
              or sealed.get("exactFilterOperationOrderReplayed") is not True
              or sealed.get("allFloatingProducerRectanglesBitExact") is not True
              or sealed.get("allDownstreamIntegerCropsExact") is not True
              or sealed.get("unseenGeometryCropReplayPassed") is not True
              or sealed.get("materialAppearanceDirectionTransferPassed") is not False
              or sealed.get("physicalRetina2xAndColorTransferPassed") is not False
              or sealed.get("independentWalleZeroByteFrameParityPassed") is not False
              or sealed.get("productionShaderAuthorized") is not False
              or sealed.get("liquidGlassParityEstablished") is not False
          ):
              raise SystemExit("blind FilterOp replay validation differs")
          PY
