name: Measure Apple Metal raster interpolation

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/raster-interpolant-probe.yml
      - Sources/GlassRasterProbe/**

concurrency:
  group: raster-interpolant-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-interpolant-probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Build Metal raster-interpolant probe
        id: build
        continue-on-error: true
        run: |
          mkdir -p raster-interpolant-probe
          set -o pipefail
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            Sources/GlassRasterProbe/main.swift \
            -o glass-raster-probe 2>&1 |
            tee raster-interpolant-probe/build.log

      - name: Measure Metal raster interpolation
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: ./glass-raster-probe raster-interpolant-probe

      - name: Upload Metal raster-interpolant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-raster-interpolant-probe-${{ github.run_id }}
          path: raster-interpolant-probe
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Metal raster-interpolant evidence
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test -s raster-interpolant-probe/manifest.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  while block := stream.read(1024 * 1024):
                      digest.update(block)
              return digest.hexdigest()

          root = Path("raster-interpolant-probe")
          with (root / "manifest.json").open(
              encoding="utf-8",
          ) as stream:
              manifest = json.load(stream)
          if manifest.get("schemaVersion") != 14:
              raise SystemExit("raster-interpolant schema differs")
          if manifest.get("rigVersion") != (
              "metal-raster-interpolant-probe-14.0.0"
          ):
              raise SystemExit("raster-interpolant rig differs")
          records = manifest.get("cases", [])
          expected_names = {
              "production-offset-800",
              "origin-zero-800",
              "power-two-512",
              "non-power-rectangle",
              "scaled-640",
              "near-fullscreen-976",
              "setup-prime-origin-a",
              "setup-prime-origin-b",
              "setup-tile-edge-translation",
              "setup-nonpower-viewport",
              "setup-cancellation",
              "setup-exponent-range",
              "setup-reversed-slopes",
              "setup-near-equal-negative",
              "setup-near-equal-zero-based",
              "setup-near-equal-power-two-viewport",
          }
          if (
              len(records) != len(expected_names)
              or {record["name"] for record in records} != expected_names
          ):
              raise SystemExit("raster-interpolant case set differs")
          for record in records:
              crop = record["crop"]
              expected = crop["width"] * crop["height"] * 16
              varying_path = root / record["varyingFile"]
              barycentric_path = root / record["barycentricFile"]
              basis_path = root / record["basisVaryingFile"]
              extra_fields = (
                  "basisNoPerspective",
                  "basisPullPerspective",
                  "basisPullNoPerspectiveX",
                  "basisPullNoPerspectiveY",
                  "sourcePullNoPerspective",
              )
              if record["varyingFileBytes"] != expected:
                  raise SystemExit(
                      f"{record['name']} varying manifest size differs"
                  )
              if record["barycentricFileBytes"] != expected:
                  raise SystemExit(
                      f"{record['name']} barycentric manifest size differs"
                  )
              if record["basisVaryingFileBytes"] != expected:
                  raise SystemExit(
                      f"{record['name']} basis manifest size differs"
                  )
              if varying_path.stat().st_size != expected:
                  raise SystemExit(
                      f"{record['name']} varying file size differs"
                  )
              if barycentric_path.stat().st_size != expected:
                  raise SystemExit(
                      f"{record['name']} barycentric file size differs"
                  )
              if basis_path.stat().st_size != expected:
                  raise SystemExit(
                      f"{record['name']} basis file size differs"
                  )
              if (
                  sha256(varying_path)
                  != record["varyingFileSha256"]
                  or sha256(barycentric_path)
                  != record["barycentricFileSha256"]
                  or sha256(basis_path)
                  != record["basisVaryingFileSha256"]
              ):
                  raise SystemExit(
                      f"{record['name']} base surface hash differs"
                  )
              for field in extra_fields:
                  if record[f"{field}FileBytes"] != expected:
                      raise SystemExit(
                          f"{record['name']} {field} manifest "
                          "size differs"
                      )
                  if (
                      root / record[f"{field}File"]
                  ).stat().st_size != expected:
                      raise SystemExit(
                          f"{record['name']} {field} file size "
                          "differs"
                      )
                  if sha256(
                      root / record[f"{field}File"]
                  ) != record[f"{field}FileSha256"]:
                      raise SystemExit(
                          f"{record['name']} {field} hash differs"
                      )

          expected_tomography = {
              "tomography-train-067x071": "discovery",
              "tomography-train-134x142-scaled": "discovery",
              "tomography-train-073x089": "discovery",
              "tomography-train-101x103": "discovery",
              "tomography-train-107x131": "discovery",
              "tomography-train-137x139": "discovery",
              "tomography-train-149x167": "discovery",
              "tomography-train-173x179": "discovery",
              "tomography-train-181x211": "discovery",
              "tomography-train-223x227": "discovery",
              "tomography-train-233x251": "discovery",
              "tomography-train-194x166-scaled": "discovery",
              "tomography-holdout-079x109": "holdout",
              "tomography-holdout-127x157": "holdout",
              "tomography-holdout-163x197": "holdout",
              "tomography-holdout-229x239": "holdout",
          }
          expected_tomography.update({
              name: "discovery"
              for name in (
                  "tomography-discovery-control-transpose-071x067",
                  "tomography-discovery-control-origin-067x071",
                  "tomography-discovery-control-viewport-067x071",
                  "tomography-discovery-control-area8192-064x128",
                  "tomography-discovery-control-area8192-032x256",
                  "tomography-discovery-control-area12000-080x150",
                  "tomography-discovery-control-area12000-100x120",
                  "tomography-discovery-control-area12000-075x160",
                  "tomography-discovery-bin00-063x067",
                  "tomography-discovery-bin01-065x069",
                  "tomography-discovery-bin02-057x083",
                  "tomography-discovery-bin03-065x077",
                  "tomography-discovery-bin04-059x089",
                  "tomography-discovery-bin05-059x093",
                  "tomography-discovery-bin06-057x101",
                  "tomography-discovery-bin07-071x085",
                  "tomography-discovery-bin08-069x091",
                  "tomography-discovery-bin09-061x107",
                  "tomography-discovery-bin10-059x115",
                  "tomography-discovery-bin11-067x105",
                  "tomography-discovery-bin12-067x109",
                  "tomography-discovery-bin13-083x091",
                  "tomography-discovery-bin14-073x107",
                  "tomography-discovery-bin15-083x097",
                  "tomography-discovery-scaled-bin00-126x134",
                  "tomography-discovery-scaled-bin01-130x138",
                  "tomography-discovery-scaled-bin02-114x166",
                  "tomography-discovery-scaled-bin03-130x154",
                  "tomography-discovery-scaled-bin04-118x178",
                  "tomography-discovery-scaled-bin05-118x186",
                  "tomography-discovery-scaled-bin06-114x202",
                  "tomography-discovery-scaled-bin07-142x170",
              )
          })
          reciprocal_sweep_geometry = {}
          reciprocal_sweep_areas = set()
          for bin_index in range(256):
              doubled_target_area = 8208 + 32 * bin_index
              candidates = []
              for width in range(32, 129):
                  for height in range(width, 129):
                      area = width * height
                      if not 4096 <= area < 8192:
                          continue
                      candidates.append((
                          abs(2 * area - doubled_target_area),
                          height - width,
                          area,
                          width,
                          height,
                      ))
              _, _, area, width, height = min(candidates)
              name = (
                  "tomography-discovery-reciprocal-bin-"
                  f"{bin_index:03d}-{width:03d}x{height:03d}"
              )
              reciprocal_sweep_geometry[name] = (
                  width,
                  height,
              )
              reciprocal_sweep_areas.add(area)
          if (
              len(reciprocal_sweep_geometry) != 256
              or len(reciprocal_sweep_areas) != 256
          ):
              raise SystemExit(
                  "reciprocal sweep generator is not bijective"
              )
          expected_tomography.update({
              name: "discovery"
              for name in reciprocal_sweep_geometry
          })
          factorized_geometry = {}
          for width in range(32, 128):
              name = (
                  "tomography-discovery-factor-"
                  f"h064-w{width:03d}"
              )
              factorized_geometry[name] = (width, 64)
          for width in range(32, 64):
              name = (
                  "tomography-discovery-factor-"
                  f"h128-w{width:03d}"
              )
              factorized_geometry[name] = (width, 128)
              if (
                  width * 128
                  != factorized_geometry[
                      "tomography-discovery-factor-"
                      f"h064-w{2 * width:03d}"
                  ][0] * 64
              ):
                  raise SystemExit(
                      "factorized equal-area pair differs"
                  )
          if len(factorized_geometry) != 128:
              raise SystemExit(
                  "factorized reciprocal generator differs"
              )
          expected_tomography.update({
              name: "discovery"
              for name in factorized_geometry
          })
          expected_numerators = [
              52625,
              51143,
              48667,
              26293,
              4519,
              20780,
              14610,
              22163,
          ]
          tomography = manifest.get(
              "reciprocalTomographyCases",
              [],
          )
          if (
              len(tomography) != len(expected_tomography)
              or {
                  record["name"]: record["role"]
                  for record in tomography
              } != expected_tomography
          ):
              raise SystemExit(
                  "raster reciprocal-tomography case set differs"
              )
          for record in tomography:
              crop = record["crop"]
              target = record["target"]
              sweep_geometry = reciprocal_sweep_geometry.get(
                  record["name"]
              )
              factor_geometry = factorized_geometry.get(
                  record["name"]
              )
              if (
                  sweep_geometry is not None
                  and (
                      (crop["width"], crop["height"])
                      != sweep_geometry
                      or crop["originX"] != 17
                      or crop["originY"] != 19
                      or target != {"width": 256, "height": 256}
                  )
              ):
                  raise SystemExit(
                      f"{record['name']} sweep geometry differs"
                  )
              if (
                  factor_geometry is not None
                  and (
                      (crop["width"], crop["height"])
                      != factor_geometry
                      or crop["originX"] != 17
                      or crop["originY"] != 19
                      or target != {"width": 160, "height": 160}
                  )
              ):
                  raise SystemExit(
                      f"{record['name']} factor geometry differs"
                  )
              if (
                  crop["originX"] < 0
                  or crop["originY"] < 0
                  or crop["originX"] + crop["width"]
                      > target["width"]
                  or crop["originY"] + crop["height"]
                      > target["height"]
              ):
                  raise SystemExit(
                      f"{record['name']} crop exceeds target"
                  )
              if (
                  record["deltaNumerators"]
                  != expected_numerators
                  or record["deltaDenominator"] != 65536
                  or len(record["deltaBits"]) != 8
              ):
                  raise SystemExit(
                      f"{record['name']} tomography ramps differ"
                  )
              outputs = record.get("outputs", [])
              if (
                  len(outputs) != 8
                  or {
                      output["deltaIndex"]
                      for output in outputs
                  } != set(range(8))
              ):
                  raise SystemExit(
                      f"{record['name']} tomography outputs differ"
                  )
              expected = crop["width"] * crop["height"] * 16
              for output in outputs:
                  path = root / output["file"]
                  index = output["deltaIndex"]
                  if (
                      output["bytes"] != expected
                      or path.stat().st_size != expected
                  ):
                      raise SystemExit(
                          f"{record['name']} tomography size differs"
                      )
                  expected_components = (
                      "x@0,x@15/16,y@0,primitive-id"
                      if index == 7
                      else "x@0,x@15/16,y@0,y@15/16"
                  )
                  expected_packing = (
                      "channel-3-raw-uint"
                      if index == 7
                      else "none"
                  )
                  if (
                      output["components"]
                      != expected_components
                      or output["primitiveIDPacking"]
                      != expected_packing
                  ):
                      raise SystemExit(
                          f"{record['name']} tomography layout differs"
                      )
                  if sha256(path) != output["sha256"]:
                      raise SystemExit(
                          f"{record['name']} tomography hash differs"
                      )

          tomography_by_name = {
              record["name"]: record
              for record in tomography
          }
          numerator_base_names = [
              "tomography-discovery-reciprocal-bin-019-058x076",
              "tomography-discovery-reciprocal-bin-055-056x089",
              "tomography-discovery-reciprocal-bin-093-047x119",
              "tomography-discovery-reciprocal-bin-148-078x083",
              "tomography-discovery-reciprocal-bin-195-084x086",
              "tomography-discovery-reciprocal-bin-224-062x124",
              "tomography-discovery-reciprocal-bin-240-081x098",
              "tomography-discovery-reciprocal-bin-255-088x093",
              "tomography-discovery-factor-h064-w058",
              "tomography-discovery-factor-h064-w056",
              "tomography-discovery-factor-h064-w047",
              "tomography-discovery-factor-h064-w078",
              "tomography-discovery-factor-h064-w084",
              "tomography-discovery-factor-h064-w062",
              "tomography-discovery-factor-h064-w081",
              "tomography-discovery-factor-h064-w088",
          ]
          numerator_values = [
              32832 + 128 * index
              for index in range(256)
          ]
          expected_numerator_records = []
          for base_name in numerator_base_names:
              base = tomography_by_name[base_name]
              if base_name.startswith(
                  "tomography-discovery-reciprocal-"
              ):
                  suffix = base_name.removeprefix(
                      "tomography-discovery-reciprocal-"
                  )
              else:
                  suffix = "factor-" + base_name.removeprefix(
                      "tomography-discovery-factor-"
                  )
              for bank_index in range(32):
                  lower = bank_index * 8
                  expected_numerator_records.append({
                      "name": (
                          f"numerator-discovery-{suffix}-"
                          f"bank-{bank_index:02d}"
                      ),
                      "baseCase": base_name,
                      "bankIndex": bank_index,
                      "numerators": numerator_values[
                          lower:lower + 8
                      ],
                  })
          numerator_records = manifest.get(
              "numeratorTomographyCases",
              [],
          )
          if (
              len(numerator_records)
              != len(expected_numerator_records)
              or [
                  {
                      "name": record["name"],
                      "baseCase": record["baseCase"],
                      "bankIndex": record["bankIndex"],
                      "numerators": record["deltaNumerators"],
                  }
                  for record in numerator_records
              ] != expected_numerator_records
          ):
              raise SystemExit(
                  "numerator tomography case set differs"
              )
          for record in numerator_records:
              base = tomography_by_name[record["baseCase"]]
              crop = record["crop"]
              if (
                  record["role"] != "discovery"
                  or "holdout" in record["name"]
                  or record["primitiveMaskCase"]
                      != record["baseCase"]
                  or crop != base["crop"]
                  or record["target"] != base["target"]
                  or record["deltaDenominator"] != 65536
                  or len(record["deltaBits"]) != 8
              ):
                  raise SystemExit(
                      f"{record['name']} numerator metadata differs"
                  )
              outputs = record.get("outputs", [])
              if (
                  len(outputs) != 8
                  or {
                      output["deltaIndex"]
                      for output in outputs
                  } != set(range(8))
              ):
                  raise SystemExit(
                      f"{record['name']} numerator outputs differ"
                  )
              expected = crop["width"] * crop["height"] * 16
              for output in outputs:
                  path = root / output["file"]
                  if (
                      output["bytes"] != expected
                      or path.stat().st_size != expected
                      or output["components"]
                          != "x@0,x@15/16,y@0,y@15/16"
                      or output["primitiveIDPacking"]
                          != "external-base-case"
                      or sha256(path) != output["sha256"]
                  ):
                      raise SystemExit(
                          f"{record['name']} numerator surface differs"
                      )

          arithmetic = manifest.get("arithmeticProbe", {})
          expected_components = [
              "operatorDivideX",
              "operatorDivideY",
              "fastDivideX",
              "fastDivideY",
              "preciseDivideX",
              "preciseDivideY",
              "fastDimensionReciprocalProductX",
              "fastDimensionReciprocalProductY",
              "preciseDimensionReciprocalProductX",
              "preciseDimensionReciprocalProductY",
              "operatorAreaDivideX",
              "operatorAreaDivideY",
              "fastAreaDivideX",
              "fastAreaDivideY",
              "preciseAreaDivideX",
              "preciseAreaDivideY",
              "fastAreaReciprocalProductX",
              "fastAreaReciprocalProductY",
              "preciseAreaReciprocalProductX",
              "preciseAreaReciprocalProductY",
              "fastReciprocalWidth",
              "fastReciprocalHeight",
              "fastReciprocalArea",
              "fastReciprocalPadding",
              "preciseReciprocalWidth",
              "preciseReciprocalHeight",
              "preciseReciprocalArea",
              "preciseReciprocalPadding",
          ]
          expected_arithmetic_cases = [
              {
                  "name": record["name"],
                  "width": record["crop"]["width"],
                  "height": record["crop"]["height"],
              }
              for record in tomography
              if record["role"] == "discovery"
          ]
          arithmetic_path = root / arithmetic.get("file", "")
          expected_arithmetic_bytes = (
              len(expected_arithmetic_cases)
              * len(expected_numerators)
              * len(expected_components)
              * 4
          )
          if (
              arithmetic.get("role") != "discovery"
              or arithmetic.get("cases")
                  != expected_arithmetic_cases
              or arithmetic.get("deltaNumerators")
                  != expected_numerators
              or arithmetic.get("deltaDenominator") != 65536
              or len(arithmetic.get("deltaBits", [])) != 8
              or arithmetic.get("vectorsPerSample") != 7
              or arithmetic.get("components")
                  != expected_components
              or arithmetic.get("ordering")
                  != "case-major,delta-major,component-major"
              or arithmetic.get("bytes")
                  != expected_arithmetic_bytes
              or not arithmetic_path.is_file()
              or arithmetic_path.stat().st_size
                  != expected_arithmetic_bytes
              or sha256(arithmetic_path)
                  != arithmetic.get("sha256")
          ):
              raise SystemExit(
                  "raster arithmetic evidence differs"
              )
          PY
