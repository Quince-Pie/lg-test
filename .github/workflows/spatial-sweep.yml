name: Capture Liquid Glass pinned-pyramid SDF scale sweep

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/spatial-sweep.yml
      - Sources/GlassSpatialSweep/**

concurrency:
  group: spatial-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spatial-sweep:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Select standard visual accessibility state
        run: |
          defaults write com.apple.universalAccess reduceTransparency -bool false
          defaults write com.apple.universalAccess reduceMotion -bool false
          defaults write com.apple.universalAccess increaseContrast -bool false
          killall cfprefsd 2>/dev/null || true

      - name: Build native spatial sweep
        id: build
        continue-on-error: true
        run: |
          mkdir -p spatial-sweep
          set -o pipefail
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            Sources/GlassSpatialSweep/main.swift \
            -o glass-spatial-sweep 2>&1 |
            tee spatial-sweep/build.log

      - name: Capture pinned-pyramid SDF scale sweep
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: ./glass-spatial-sweep spatial-sweep --pinned-sdf-scale

      - name: Inventory native spatial sweep
        if: always()
        run: |
          find spatial-sweep -maxdepth 1 -type f -print -exec du -h {} \;

      - name: Upload native spatial sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-pinned-sdf-scale-sweep-${{ github.run_id }}
          path: spatial-sweep
          if-no-files-found: error
          retention-days: 7

      - name: Enforce native spatial sweep
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test -s spatial-sweep/manifest.json
          test -s spatial-sweep/native-pinned-sdf-scale-control-patches.rgb8
          test -s spatial-sweep/native-pinned-sdf-scale-identity-patches.rgb8
