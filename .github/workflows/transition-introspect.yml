name: Introspect Liquid Glass transition

on:
  workflow_dispatch:
    inputs:
      capture_mode:
        description: Transition evidence matrix to capture
        required: true
        default: state-matrix
        type: choice
        options:
          - state-matrix
          - uniform-profiles

concurrency:
  group: transition-introspect-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transition-introspect:
    name: ${{ matrix.label }}
    runs-on: macos-26
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: profile-clear-light-materialize
            material: clear
            appearance: light
            geometry: circle-800-center
            direction: materialize
          - label: profile-clear-light-dematerialize
            material: clear
            appearance: light
            geometry: circle-800-center
            direction: dematerialize
          - label: profile-clear-dark-materialize
            material: clear
            appearance: dark
            geometry: circle-800-center
            direction: materialize
          - label: profile-clear-dark-dematerialize
            material: clear
            appearance: dark
            geometry: circle-800-center
            direction: dematerialize
          - label: profile-regular-light-materialize
            material: regular
            appearance: light
            geometry: circle-800-center
            direction: materialize
          - label: profile-regular-light-dematerialize
            material: regular
            appearance: light
            geometry: circle-800-center
            direction: dematerialize
          - label: profile-regular-dark-materialize
            material: regular
            appearance: dark
            geometry: circle-800-center
            direction: materialize
          - label: profile-regular-dark-dematerialize
            material: regular
            appearance: dark
            geometry: circle-800-center
            direction: dematerialize
          - label: geometry-256-materialize
            material: clear
            appearance: light
            geometry: circle-256-center
            direction: materialize
          - label: geometry-256-dematerialize
            material: clear
            appearance: light
            geometry: circle-256-center
            direction: dematerialize
          - label: geometry-offset-materialize
            material: clear
            appearance: light
            geometry: circle-512-offset
            direction: materialize
          - label: geometry-offset-dematerialize
            material: clear
            appearance: light
            geometry: circle-512-offset
            direction: dematerialize
          - label: geometry-fractional-materialize
            material: clear
            appearance: light
            geometry: circle-640-fractional
            direction: materialize
          - label: geometry-fractional-dematerialize
            material: clear
            appearance: light
            geometry: circle-640-fractional
            direction: dematerialize
          - label: geometry-clipped-materialize
            material: clear
            appearance: light
            geometry: circle-1536-center
            direction: materialize
          - label: geometry-clipped-dematerialize
            material: clear
            appearance: light
            geometry: circle-1536-center
            direction: dematerialize
    env:
      LG_GLASS_MATERIAL: ${{ matrix.material }}
      LG_GLASS_APPEARANCE: ${{ matrix.appearance }}
      LG_GLASS_GEOMETRY: ${{ matrix.geometry }}
      LG_TRANSITION_TIMELINE: "1"
      LG_TRANSITION_DIRECTION: ${{ matrix.direction }}
      LG_TRANSITION_UNIFORMS: >-
        ${{ inputs.capture_mode == 'uniform-profiles' &&
        matrix.direction == 'materialize' &&
        startsWith(matrix.label, 'profile-') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Select standard visual accessibility state
        run: |
          defaults write com.apple.universalAccess reduceTransparency -bool false
          defaults write com.apple.universalAccess reduceMotion -bool false
          defaults write com.apple.universalAccess increaseContrast -bool false
          killall cfprefsd 2>/dev/null || true

      - name: Build transition introspection probe
        id: build
        continue-on-error: true
        run: |
          mkdir -p transition-introspection
          set -o pipefail
          xcrun clang \
            -std=c23 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -target "$(uname -m)-apple-macos26.0" \
            -c Sources/GlassIntrospect/MatrixBridge.c \
            -o transition-introspection/MatrixBridge.o 2>&1 |
            tee transition-introspection/build.log
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            -import-objc-header Sources/GlassIntrospect/MatrixBridge.h \
            Sources/GlassIntrospect/HalfBlendProbe.swift \
            Sources/GlassIntrospect/HalfDotProbe.swift \
            Sources/GlassIntrospect/HalfIntrinsicProbe.swift \
            Sources/GlassIntrospect/SDFStageProbe.swift \
            Sources/GlassIntrospect/main.swift \
            transition-introspection/MatrixBridge.o \
            -o glass-transition-introspect 2>&1 |
            tee -a transition-introspection/build.log

      - name: Capture paced presentation state and real window pixels
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ./glass-transition-introspect transition-introspection \
            > transition-introspection/runtime-stdout.log \
            2> transition-introspection/runtime-stderr.log

      - name: Upload transition introspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-transition-introspection-${{ matrix.label }}-${{ github.run_id }}
          path: transition-introspection
          if-no-files-found: error
          retention-days: 7

      - name: Enforce transition evidence
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test -s transition-introspection/transition-timeline.json
          python3 - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path("transition-introspection")
          report = json.loads(
              (root / "transition-timeline.json").read_text(
                  encoding="utf-8"
              )
          )
          if report.get("schemaVersion") != 5:
              raise SystemExit("transition timeline schema is not 5")
          if (
              report.get("material") != "${{ matrix.material }}"
              or report.get("appearance") != "${{ matrix.appearance }}"
              or report.get("direction") != "${{ matrix.direction }}"
              or report.get("geometry", {}).get("name")
                  != "${{ matrix.geometry }}"
              or report.get("animationCurve") != "linear"
              or report.get("samplingMethod")
                  != "real-presentation-state-plus-own-window-pixels"
              or report.get("captureBackend")
                  != "CGWindowListCreateImage"
              or report.get("sampleCount") != 33
              or report.get("failedSamples") != 0
          ):
              raise SystemExit(
                  "transition timeline metadata differs: "
                  f"{report.get('material')}, "
                  f"{report.get('appearance')}, "
                  f"{report.get('direction')}, "
                  f"{report.get('geometry', {}).get('name')}, "
                  f"{report.get('animationCurve')}, "
                  f"{report.get('samplingMethod')}, "
                  f"{report.get('sampleCount')}, "
                  f"{report.get('failedSamples')}"
              )
          uniform_requested = (
              os.environ.get("LG_TRANSITION_UNIFORMS") == "1"
          )
          uniforms = report.get(
              "dynamicBackgroundUniforms", {}
          )
          if (
              not isinstance(uniforms, dict)
              or uniforms.get("schemaVersion") != 1
              or uniforms.get("requested")
                  is not uniform_requested
              or uniforms.get("presentationLayerReplayed")
                  is not False
          ):
              raise SystemExit(
                  "transition uniform metadata differs: "
                  f"{uniforms}"
              )
          if uniform_requested:
              expected_uniform_indices = [
                  1, 4, 8, 12, 16, 20, 24, 28, 32
              ]
              records = uniforms.get("records", [])
              if (
                  uniforms.get("executed") is not True
                  or uniforms.get("sampleIndices")
                      != expected_uniform_indices
                  or uniforms.get("sampleCount") != 9
                  or uniforms.get("executedSampleCount") != 9
                  or uniforms.get("method")
                      != "copied-presentation-background-filter-"
                         "on-settled-model-tree"
                  or not isinstance(
                      uniforms.get("modelTargetPath"), list
                  )
                  or len(records) != 9
              ):
                  raise SystemExit(
                      "transition uniform capture is incomplete: "
                      f"{uniforms}"
                  )
              for expected_index, record in zip(
                  expected_uniform_indices,
                  records,
              ):
                  render = record.get("render", {})
                  filter_values = record.get(
                      "filter", {}
                  ).get("inputValues", {})
                  bindings = render.get(
                      "glassFragmentUniformBindings", []
                  )
                  background_bindings = []
                  for binding in bindings:
                      pipeline = binding.get(
                          "pipeline", {}
                      ).get("creationDescriptor", {})
                      fragment = pipeline.get(
                          "fragmentFunction", ""
                      )
                      payload = binding.get("payload", {})
                      if (
                          binding.get("stage") != "fragment"
                          or binding.get("index") != 1
                          or not isinstance(payload, dict)
                          or payload.get("lengthBytes", 0) < 258
                          or not isinstance(
                              payload.get("hex"), str
                          )
                          or len(payload["hex"])
                              != payload["lengthBytes"] * 2
                      ):
                          raise SystemExit(
                              "transition uniform binding is "
                              f"incomplete: {binding}"
                          )
                      if str(fragment).startswith(
                          "glass_background"
                      ):
                          background_bindings.append(binding)
                  if (
                      record.get("sampleIndex")
                          != expected_index
                      or render.get("executed") is not True
                      or render.get(
                          "glassFragmentUniformBindingCount"
                      ) != len(bindings)
                      or len(background_bindings) != 2
                      or filter_values.get("inputFaceOpacity")
                          != record.get("remaining")
                      or render.get("durationSeconds", 31) > 30
                  ):
                      raise SystemExit(
                          "transition uniform sample differs: "
                          f"{record}"
                      )
          elif uniforms.get("executed") is not False:
              raise SystemExit(
                  "unrequested transition uniforms executed"
              )
          samples = report.get("samples", [])
          if len(samples) != 33:
              raise SystemExit(
                  f"transition timeline has {len(samples)} samples"
              )
          expected_progress = [
              index / 32 for index in range(33)
          ]
          if [
              sample.get("progress") for sample in samples
          ] != expected_progress:
              raise SystemExit(
                  "transition timeline progress grid differs"
              )
          actual_progress = [
              sample.get("actualProgress") for sample in samples
          ]
          if (
              actual_progress[0] != 0
              or any(
                  not isinstance(value, (int, float))
                  for value in actual_progress
              )
              or any(
                  later <= earlier
                  for earlier, later in zip(
                      actual_progress, actual_progress[1:]
                  )
              )
              or max(
                  abs(actual - requested)
                  for actual, requested in zip(
                      actual_progress[1:],
                      expected_progress[1:],
                  )
              ) > 0.04
          ):
              raise SystemExit(
                  "transition presentation sampling drifted: "
                  f"{actual_progress}"
              )
          expected_pixels = report.get("expectedWindowPixels")
          if (
              not isinstance(expected_pixels, list)
              or len(expected_pixels) != 2
              or any(
                  not isinstance(value, int) or value <= 0
                  for value in expected_pixels
              )
          ):
              raise SystemExit(
                  "transition window pixel dimensions are invalid: "
                  f"{expected_pixels}"
              )
          for index, sample in enumerate(samples):
              if sample.get("executed") is not True:
                  raise SystemExit(
                      f"transition sample {index} did not execute"
                  )
              output = sample.get("windowCapture", {})
              png_file = output.get("pngFile")
              if (
                  output.get("backend")
                      != "CGWindowListCreateImage"
                  or [
                      output.get("width"),
                      output.get("height"),
                  ] != expected_pixels
                  or output.get("pixelBytes")
                      != expected_pixels[0]
                          * expected_pixels[1] * 4
                  or output.get("bytesPerRow")
                      != expected_pixels[0] * 4
                  or not isinstance(
                      output.get("pixelSHA256"), str
                  )
                  or len(output["pixelSHA256"]) != 64
                  or not isinstance(
                      output.get("pngSHA256"), str
                  )
                  or len(output["pngSHA256"]) != 64
                  or not isinstance(png_file, str)
                  or not (root / png_file).is_file()
                  or (root / png_file).stat().st_size
                      != output.get("pngBytes")
                  or output.get(
                      "captureDurationSeconds", 1
                  ) > 0.25
                  or sample.get(
                      "stateBracketSeconds", 1
                  ) > 0.30
              ):
                  raise SystemExit(
                      f"transition sample {index} output differs: "
                      f"{output}"
                  )
              if (
                  not isinstance(
                      sample.get(
                          "presentationStateBeforeCapture"
                      ),
                      dict,
                  )
                  or not isinstance(
                      sample.get(
                          "presentationStateAfterCapture"
                      ),
                      dict,
                  )
              ):
                  raise SystemExit(
                      f"transition sample {index} lacks "
                      "bracketing presentation-state evidence"
                  )

          def state_filters(state):
              for record in state.get("records", []):
                  for key in (
                      "filters",
                      "backgroundFilters",
                  ):
                      for value in record.get(key, []):
                          yield value
                  value = record.get("compositingFilter")
                  if isinstance(value, dict):
                      yield value

          def is_glass_background(value):
              serialized = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
              ).lower()
              return (
                  "glassbackground" in serialized
                  or "glass_background" in serialized
              )

          def filter_state(value):
              known = value.get("knownValues", {})
              return {
                  "class": value.get("class"),
                  "name": known.get("name"),
                  "type": known.get("type"),
                  "inputValues": value.get("inputValues"),
              }

          def physical_state(state):
              records = []
              for record in state.get("records", []):
                  physical = {
                      key: record.get(key)
                      for key in (
                          "path",
                          "class",
                          "frame",
                          "bounds",
                          "position",
                          "anchorPoint",
                          "zPosition",
                          "opacity",
                          "cornerRadius",
                          "transform",
                          "sublayerTransform",
                      )
                  }
                  for key in (
                      "filters",
                      "backgroundFilters",
                  ):
                      if key in record:
                          physical[key] = [
                              filter_state(value)
                              for value in record[key]
                          ]
                  if "compositingFilter" in record:
                      physical["compositingFilter"] = (
                          filter_state(
                              record["compositingFilter"]
                          )
                      )
                  records.append(physical)
              return records

          glass_profiles = set()
          glass_profile_samples = 0
          exact_color_samples = 0
          glass_presence = []
          for sample in samples:
              sample_profiles = [
                  value
                  for state_key in (
                      "presentationStateBeforeCapture",
                      "presentationStateAfterCapture",
                  )
                  for value in state_filters(
                      sample[state_key]
                  )
                  if is_glass_background(value)
              ]
              glass_presence.append(bool(sample_profiles))
              if sample_profiles:
                  glass_profile_samples += 1
                  exact_colors = []
                  for profile in sample_profiles:
                      values = profile.get(
                          "inputValues", {}
                      )
                      for key in (
                          "inputFaceColorMatrixFillColor",
                          "inputShadowColorMatrixFillColor",
                      ):
                          color = values.get(key)
                          if not isinstance(color, dict):
                              continue
                          components = color.get("components")
                          count = color.get(
                              "numberOfComponents"
                          )
                          if (
                              not isinstance(components, list)
                              or not isinstance(count, int)
                              or len(components) != count
                              or not components
                              or any(
                                  not isinstance(
                                      component,
                                      (int, float),
                                  )
                                  for component in components
                              )
                              or not isinstance(
                                  color.get("alpha"),
                                  (int, float),
                              )
                          ):
                              raise SystemExit(
                                  "transition CGColor evidence "
                                  f"is incomplete: {color}"
                              )
                          exact_colors.append(color)
                  if exact_colors:
                      exact_color_samples += 1
                  glass_profiles.update(
                      json.dumps(
                          filter_state(value),
                          sort_keys=True,
                          separators=(",", ":"),
                      )
                      for value in sample_profiles
                  )
          if glass_profile_samples < 16:
              raise SystemExit(
                  "transition timeline captured glass profiles in only "
                  f"{glass_profile_samples}/33 states"
              )
          expected_endpoints = (
              (False, True)
              if report["direction"] == "materialize"
              else (True, False)
          )
          if (
              glass_presence[0],
              glass_presence[-1],
          ) != expected_endpoints:
              raise SystemExit(
                  "transition endpoint topology differs: "
                  f"{glass_presence[0]}, {glass_presence[-1]}"
              )
          if len(glass_profiles) < 8:
              raise SystemExit(
                  "transition private profiles lack state rank: "
                  f"{len(glass_profiles)} distinct profiles"
              )
          if exact_color_samples < 16:
              raise SystemExit(
                  "transition timeline captured exact CGColor "
                  f"components in only {exact_color_samples}/33 states"
              )
          state_hashes = {
              __import__("hashlib").sha256(
                  json.dumps(
                      physical_state(
                          sample[
                              "presentationStateBeforeCapture"
                          ]
                      ),
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode()
              ).hexdigest()
              for sample in samples
          }
          if len(state_hashes) < 8:
              raise SystemExit(
                  "transition presentation states lack rank: "
                  f"{len(state_hashes)} distinct states"
              )
          output_hashes = {
              sample["windowCapture"]["pixelSHA256"]
              for sample in samples
          }
          if len(output_hashes) < 8:
              raise SystemExit(
                  "transition timeline outputs lack state rank: "
                  f"{len(output_hashes)} distinct frames"
              )
          PY
