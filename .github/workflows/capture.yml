name: Capture Liquid Glass samples

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Capture suite
        required: true
        default: all
        type: choice
        options:
          - all
          - static
          - dynamic
      capture_width:
        description: Capture window width in points
        required: true
        default: 3200
        type: number
      capture_height:
        description: Capture window height in points
        required: true
        default: 2000
        type: number
      dynamic_frames:
        description: Target grid points per dynamic sequence (including endpoints)
        required: true
        default: 61
        type: number
      dynamic_duration:
        description: Linear animation duration in seconds
        required: true
        default: 1.0
        type: number
      dynamic_modes:
        description: all or comma-separated dynamic mode names
        required: true
        default: all
        type: string
      transition_origin:
        description: Normalized two-wallpaper transition origin x,y
        required: true
        default: "0.25,0.30"
        type: string
      exact_sweeps:
        description: Capture cold/reverse/repeated settled geometry traversals
        required: true
        default: true
        type: boolean
  push:
    paths:
      - Analysis/measure.py
      - Analysis/probe_catalog.py
      - Analysis/requirements.txt
      - Analysis/test_measure.py
      - Analysis/test_transition_matrix_internals.py
      - Analysis/test_validate.py
      - Analysis/validate.py
      - Analysis/validate_transition_matrix_internals.py
      - Sources/GlassCapture/**
      - Sources/GlassIntrospect/**

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    # Liquid Glass exists only on macOS 26 (Tahoe) — do not downgrade this label.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          system_profiler SPDisplaysDataType | sed -n '1,40p'

      - name: Require macOS 26+
        run: |
          major="$(sw_vers -productVersion | cut -d. -f1)"
          if [ "$major" -lt 26 ]; then
            echo "::error::Liquid Glass requires macOS 26, runner has $(sw_vers -productVersion)"
            exit 1
          fi

      # The runner's virtual display offers no HiDPI (scaling:on) modes, so 2x
      # capture is not achievable; high resolution comes from the 3200x2000pt
      # capture window instead (its full backing store is captured even while
      # extending past the screen). Bumping to the largest 1x mode is a
      # best-effort nicety only.
      - name: Set largest display mode (best effort)
        continue-on-error: true
        run: |
          brew install --quiet jakehilborn/jakehilborn/displayplacer || true
          id="$(displayplacer list | awk '/Persistent screen id/{print $NF; exit}')"
          [ -n "$id" ] && displayplacer "id:$id res:1920x1080 hz:60 color_depth:7" || true
          displayplacer list | grep -E 'Resolution|Scaling' || true

      # GitHub's macOS image currently boots with Reduce Transparency and
      # Reduce Motion enabled. That substitutes opaque accessibility platters
      # for Liquid Glass and suppresses the transition frames we are trying
      # to measure. The app independently checks these values and aborts
      # before the expensive matrix if changing them did not take effect.
      - name: Select standard visual accessibility state
        run: |
          defaults write com.apple.universalAccess reduceTransparency -bool false
          defaults write com.apple.universalAccess reduceMotion -bool false
          defaults write com.apple.universalAccess increaseContrast -bool false
          killall cfprefsd 2>/dev/null || true
          sleep 2
          defaults read com.apple.universalAccess reduceTransparency
          defaults read com.apple.universalAccess reduceMotion
          defaults read com.apple.universalAccess increaseContrast

      # Live evidence uses a desktop-independent SCStream so frame delivery
      # does not serialize WindowServer behind oversized snapshots. Settled
      # own-window captures retain the legacy no-TCC path.
      - name: Grant Screen Recording TCC (live stream, best effort)
        continue-on-error: true
        run: |
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          for client in /usr/sbin/screencapture "$PWD/glasscap"; do
            sudo sqlite3 "$db" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified)
               VALUES ('kTCCServiceScreenCapture', '$client', 1, 2, 4, 1, 'UNUSED', 0, strftime('%s','now'));" || true
          done

      - name: Build
        run: |
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            Sources/GlassCapture/main.swift \
            -o glasscap

      - name: Build Liquid Glass introspection probe
        id: introspection_build
        continue-on-error: true
        run: |
          build_root="$RUNNER_TEMP/glass-introspect-build"
          mkdir -p "$build_root"
          set -o pipefail
          xcrun clang \
            -std=c23 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -target "$(uname -m)-apple-macos26.0" \
            -c Sources/GlassIntrospect/MatrixBridge.c \
            -o "$build_root/MatrixBridge.o" 2>&1 |
            tee "$build_root/build.log"
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            -import-objc-header Sources/GlassIntrospect/MatrixBridge.h \
            Sources/GlassIntrospect/HalfBlendProbe.swift \
            Sources/GlassIntrospect/HalfDotProbe.swift \
            Sources/GlassIntrospect/HalfIntrinsicProbe.swift \
            Sources/GlassIntrospect/SDFStageProbe.swift \
            Sources/GlassIntrospect/main.swift \
            "$build_root/MatrixBridge.o" \
            -o glassintrospect 2>&1 |
            tee -a "$build_root/build.log"

      - name: Set up analysis Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Analysis/requirements.txt

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check -r Analysis/requirements.txt

      - name: Test artifact validator
        run: python -m unittest discover -s Analysis -v

      - name: Capture
        id: capture
        continue-on-error: true
        run: |
          set -uo pipefail
          extra_args=()
          if [ "${{ inputs.exact_sweeps }}" = "false" ]; then
            extra_args+=(--skip-exact-sweeps)
          fi
          suite="${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'static' }}"
          capture_args=(
            --width "${{ inputs.capture_width || 3200 }}"
            --height "${{ inputs.capture_height || 2000 }}"
            --suite "$suite"
            --dynamic-frames "${{ inputs.dynamic_frames || 61 }}"
            --dynamic-duration "${{ inputs.dynamic_duration || 1.0 }}"
            --dynamic-modes "${{ inputs.dynamic_modes || 'all' }}"
            --transition-origin "${{ inputs.transition_origin || '0.25,0.30' }}"
            "${extra_args[@]}"
          )

          if [ "$suite" != dynamic ]; then
            ./glasscap --out captures "${capture_args[@]}"
            exit
          fi

          # Hosted WindowServer scheduling is stochastic even when stream
          # delivery itself is healthy.
          # Retry the complete focused suite, never individual frames, and
          # accept only the first artifact that passes the same strict
          # validator used by the final gate. Resolution, animation schedule,
          # source fields, and every temporal/pixel threshold remain unchanged.
          max_attempts=3
          diagnostics="$RUNNER_TEMP/liquid-glass-capture-attempts"
          mkdir -p "$diagnostics"
          selected=false

          for attempt in $(seq 1 "$max_attempts"); do
            attempt_dir="$RUNNER_TEMP/liquid-glass-captures-attempt-$attempt"
            attempt_diagnostics="$diagnostics/attempt-$attempt"
            mkdir -p "$attempt_diagnostics"
            echo "dynamic capture attempt $attempt/$max_attempts"

            set +e
            ./glasscap \
              --out "$attempt_dir" \
              "${capture_args[@]}" 2>&1 |
              tee "$attempt_diagnostics/capture.log"
            capture_status=${PIPESTATUS[0]}

            validation_status=1
            if [ -f "$attempt_dir/manifest.json" ]; then
              python Analysis/validate.py "$attempt_dir" \
                --strict \
                --report "$attempt_dir/validation.json" 2>&1 |
                tee "$attempt_diagnostics/validation.log"
              validation_status=${PIPESTATUS[0]}
              cp "$attempt_dir/manifest.json" \
                "$attempt_diagnostics/manifest.json"
              if [ -f "$attempt_dir/validation.json" ]; then
                cp "$attempt_dir/validation.json" \
                  "$attempt_diagnostics/validation.json"
              fi
            else
              echo "manifest missing" |
                tee "$attempt_diagnostics/validation.log"
            fi
            set -e

            {
              echo "capture_status=$capture_status"
              echo "validation_status=$validation_status"
            } > "$attempt_diagnostics/status.txt"

            if [ "$capture_status" -eq 0 ] &&
               [ "$validation_status" -eq 0 ]; then
              mv "$attempt_dir" captures
              selected=true
              echo "selected strict-valid dynamic attempt $attempt"
              break
            fi

            echo "rejected dynamic attempt $attempt"
            if [ "$attempt" -eq "$max_attempts" ]; then
              if [ -d "$attempt_dir" ]; then
                mv "$attempt_dir" captures
              else
                mkdir -p captures
              fi
            fi
          done

          cp -R "$diagnostics" captures/capture-attempts
          if [ "$selected" != true ]; then
            echo "::error::No dynamic attempt passed strict validation."
            exit 1
          fi

      - name: Probe real Liquid Glass render pipeline
        if: always()
        id: introspection
        continue-on-error: true
        env:
          MTL_CAPTURE_ENABLED: "1"
        run: |
          mkdir -p captures/introspection
          build_log="$RUNNER_TEMP/glass-introspect-build/build.log"
          if [ -f "$build_log" ]; then
            cp "$build_log" captures/introspection/build.log
          fi
          if [ "${{ steps.introspection_build.outcome }}" = success ]; then
            ./glassintrospect captures/introspection ||
              echo "introspection app exited nonzero; retaining diagnostics"
          else
            echo "introspection app did not build" \
              > captures/introspection/runtime-error.txt
          fi

          framework_output="captures/introspection/framework-evidence.txt"
          {
            for binary in \
              /System/Library/Frameworks/SwiftUI.framework/Versions/A/SwiftUI \
              /System/Library/Frameworks/QuartzCore.framework/Versions/A/QuartzCore \
              /System/Library/Frameworks/CoreImage.framework/Versions/A/CoreImage
            do
              echo "BINARY $binary"
              string_evidence="$RUNNER_TEMP/$(basename "$binary").strings"
              strings -a "$binary" 2>/dev/null |
                grep -Ei 'liquid.?glass|glass.?effect|glassBackground|backdrop|gaussian|blur|color.?matrix|vibrant|downsample|upsample|sdf|portal' |
                sort -u > "$string_evidence" || true
              if xcrun --find swift-demangle >/dev/null 2>&1; then
                xcrun swift-demangle < "$string_evidence" |
                  head -n 400 || true
              else
                head -n 400 "$string_evidence" || true
              fi

              symbol_evidence="$RUNNER_TEMP/$(basename "$binary").symbols"
              nm -gjU "$binary" 2>/dev/null |
                grep -Ei 'glass|backdrop|gaussian|blur|vibrant|matrix|sdf|portal' |
                sort -u > "$symbol_evidence" || true
              if xcrun --find swift-demangle >/dev/null 2>&1; then
                xcrun swift-demangle < "$symbol_evidence" |
                  head -n 400 || true
              else
                head -n 400 "$symbol_evidence" || true
              fi
            done
          } > "$framework_output"

          find captures/introspection -maxdepth 3 -type f -print -exec du -h {} \;

      - name: Upload Liquid Glass introspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-introspection-${{ github.run_id }}
          path: captures/introspection
          if-no-files-found: error
          retention-days: 7

      - name: Validate artifact
        if: always()
        id: validate
        continue-on-error: true
        run: |
          python Analysis/validate.py captures \
            --strict \
            --report captures/validation.json

      - name: Measure optical evidence
        if: steps.capture.outcome == 'success'
        id: measure
        continue-on-error: true
        run: |
          python Analysis/measure.py captures \
            --report captures/measurements.json

      - name: Summarize
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path

          path = Path("captures/manifest.json")
          if not path.is_file():
              print("manifest missing")
              raise SystemExit()
          manifest = json.loads(path.read_text())
          dynamic = manifest["dynamicSequences"]
          frames = sum(len(sequence["frames"]) for sequence in dynamic)
          targets = len(dynamic) * manifest["dynamicFrameCount"]
          sweeps = manifest.get("sweepSequences", [])
          sweep_frames = sum(
              sum(
                  len(sequence.get(key, []))
                  for key in ("frames", "reverseFrames", "repeatFrames")
              )
              for sequence in sweeps
          )
          print(
              f"references={len(manifest['references'])} "
              f"static={len(manifest['captures'])} "
              f"dynamic_sequences={len(dynamic)} "
              f"dynamic_frames={frames}/{targets}_targets "
              f"sweep_sequences={len(sweeps)} "
              f"sweep_frames={sweep_frames}"
          )
          print(
              f"scale={manifest['backingScaleFactor']}x "
              f"os={manifest['osVersion']} build={manifest['osBuild']}"
          )
          EOF
          du -sh captures 2>/dev/null || true

      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-captures-${{ github.run_id }}-${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'static' }}
          path: captures
          compression-level: 0   # PNGs are already compressed
          if-no-files-found: error
          retention-days: 90

      - name: Enforce capture and validation
        if: always()
        run: |
          if [ "${{ steps.capture.outcome }}" != success ]; then
            echo "::error::The capture app reported incomplete or invalid evidence."
            exit 1
          fi
          if [ "${{ steps.validate.outcome }}" != success ]; then
            echo "::error::Artifact validation failed; inspect validation.json."
            exit 1
          fi
          if [ "${{ steps.measure.outcome }}" != success ]; then
            echo "::error::Optical measurement failed; inspect the job log."
            exit 1
          fi
