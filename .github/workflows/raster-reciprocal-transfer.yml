name: Validate Apple Metal raster reciprocal scale transfer

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/raster-reciprocal-transfer.yml
      - Analysis/raster_reciprocal_scale_transfer_capture_amendment.json
      - Analysis/raster_reciprocal_scale_transfer_preregistration.json
      - Analysis/test_validate_reciprocal_scale_transfer.py
      - Analysis/validate_reciprocal_scale_transfer.py
      - Sources/GlassRasterReciprocalTransfer/**

concurrency:
  group: raster-reciprocal-scale-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-reciprocal-scale-transfer:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Build Metal reciprocal-scale-transfer probe
        id: build
        continue-on-error: true
        run: |
          mkdir -p raster-reciprocal-scale-transfer
          set -o pipefail
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            Sources/GlassRasterReciprocalTransfer/main.swift \
            -o glass-raster-reciprocal-scale-transfer 2>&1 |
            tee raster-reciprocal-scale-transfer/build.log

      - name: Measure isolated prospective reciprocal scale transfer
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          SWIFT_BACKTRACE: enable
        run: |
          ./glass-raster-reciprocal-scale-transfer \
            raster-reciprocal-scale-transfer

      - name: Validate frozen transfer predictions
        id: validate
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          python3 Analysis/validate_reciprocal_scale_transfer.py \
            raster-reciprocal-scale-transfer \
            --output raster-reciprocal-scale-transfer/validation.json

      - name: Upload Metal reciprocal-scale-transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-raster-reciprocal-scale-transfer-${{ github.run_id }}
          path: raster-reciprocal-scale-transfer
          if-no-files-found: error
          retention-days: 7

      - name: Enforce prospective transfer gate
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test "${{ steps.validate.outcome }}" = success
          test -s raster-reciprocal-scale-transfer/manifest.json
          test -s raster-reciprocal-scale-transfer/validation.json
