name: Recover Apple Metal top-left general-height slopes

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/raster-reciprocal-transfer.yml
      - Analysis/raster_general_height_diagnostic_preregistration.json
      - Analysis/raster_general_height_multitile_preregistration.json
      - Analysis/raster_general_height_multitile_candidate_masks.zlib
      - Analysis/raster_general_height_top_left_preregistration.json
      - Analysis/build_raster_general_height_multitile_candidate_masks.py
      - Analysis/test_validate_raster_general_height_diagnostic.py
      - Analysis/test_validate_raster_general_height_multitile.py
      - Analysis/test_validate_raster_general_height_top_left.py
      - Analysis/validate_raster_general_height_diagnostic.py
      - Analysis/validate_raster_general_height_multitile.py
      - Analysis/validate_raster_general_height_top_left.py
      - Sources/GlassRasterReciprocalTransfer/**

concurrency:
  group: raster-reciprocal-scale-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-reciprocal-general-height-transfer:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Build Metal top-left general-height probe
        id: build
        continue-on-error: true
        run: |
          mkdir -p raster-general-height-top-left
          set -o pipefail
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            Sources/GlassRasterReciprocalTransfer/main.swift \
            -o glass-raster-general-height-top-left 2>&1 |
            tee raster-general-height-top-left/build.log

      - name: Measure top-left general-height coefficients at low magnitude
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          SWIFT_BACKTRACE: enable
        run: |
          ./glass-raster-general-height-top-left \
            raster-general-height-top-left

      - name: Validate slopes and cross-primitive equality
        id: validate
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          python3 Analysis/validate_raster_general_height_top_left.py \
            raster-general-height-top-left \
            --output raster-general-height-top-left/validation.json

      - name: Upload Metal top-left general-height evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-raster-general-height-top-left-${{ github.run_id }}
          path: raster-general-height-top-left
          if-no-files-found: error
          retention-days: 7

      - name: Enforce diagnostic control gate
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test "${{ steps.validate.outcome }}" = success
          test -s raster-general-height-top-left/manifest.json
          test -s raster-general-height-top-left/validation.json
