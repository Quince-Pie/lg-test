name: Inspect captured Apple highlight pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/highlight-pipeline-introspect.yml
      - Sources/GlassIntrospect/**

concurrency:
  group: highlight-pipeline-introspect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  highlight-pipeline-introspect:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      LG_GLASS_MATERIAL: clear
      LG_GLASS_APPEARANCE: light
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Select standard visual accessibility state
        run: |
          defaults write com.apple.universalAccess reduceTransparency -bool false
          defaults write com.apple.universalAccess reduceMotion -bool false
          defaults write com.apple.universalAccess increaseContrast -bool false
          killall cfprefsd 2>/dev/null || true

      - name: Build Liquid Glass introspection probe
        id: build
        continue-on-error: true
        run: |
          mkdir -p introspection
          set -o pipefail
          xcrun clang \
            -std=c23 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -target "$(uname -m)-apple-macos26.0" \
            -c Sources/GlassIntrospect/MatrixBridge.c \
            -o introspection/MatrixBridge.o 2>&1 |
            tee introspection/build.log
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            -import-objc-header Sources/GlassIntrospect/MatrixBridge.h \
            Sources/GlassIntrospect/HalfBlendProbe.swift \
            Sources/GlassIntrospect/HalfDotProbe.swift \
            Sources/GlassIntrospect/HalfIntrinsicProbe.swift \
            Sources/GlassIntrospect/SDFStageProbe.swift \
            Sources/GlassIntrospect/main.swift \
            introspection/MatrixBridge.o \
            -o glassintrospect 2>&1 |
            tee -a introspection/build.log

      - name: Capture Apple post-glass attachments
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          MTL_CAPTURE_ENABLED: "1"
          LG_EXECUTE_INDEPENDENT_GLASS: "0"
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess

          root = pathlib.Path("introspection")
          with (root / "runtime-stdout.log").open("wb") as stdout, \
               (root / "runtime-stderr.log").open("wb") as stderr:
              result = subprocess.run(
                  ["./glassintrospect", str(root)],
                  check=False,
                  timeout=240,
                  stdout=stdout,
                  stderr=stderr,
              )
          if result.returncode:
              raise SystemExit(
                  f"glassintrospect exited {result.returncode}"
              )
          PY

      - name: Interrogate captured GPU trace
        id: gpudebug
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p introspection/gpudebug
          trace="introspection/liquid-glass.gputrace"
          test -d "$trace"

          if tool="$(xcrun --find gpudebug 2>/dev/null)"; then
            printf '%s\n' "$tool" > introspection/gpudebug/tool-path.txt
          elif tool="$(command -v gpudebug 2>/dev/null)"; then
            printf '%s\n' "$tool" > introspection/gpudebug/tool-path.txt
          else
            printf '%s\n' \
              "gpudebug is unavailable in the selected Xcode" \
              > introspection/gpudebug/unavailable.txt
            exit 1
          fi

          "$tool" --help \
            > introspection/gpudebug/help.txt 2>&1 || true
          MANWIDTH=200 man gpudebug 2>&1 | col -bx \
            > introspection/gpudebug/manual.txt || true
          "$tool" --oneshot -t "$trace" -c "list --all" \
            > introspection/gpudebug/root.txt 2>&1

      - name: Validate captured Apple attachment sweep
        id: validate
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import struct

          root = pathlib.Path("introspection")
          runtime = json.loads(
              (root / "runtime.json").read_text(encoding="utf-8")
          )
          sweep = runtime[
              "carendererLocalBackdropEvidence"
          ]["render"]["exactPassReplay"][
              "postGlassDestinationSweep"
          ]
          alpha_trace = runtime[
              "carendererLocalBackdropEvidence"
          ]["render"]["exactPassReplay"][
              "finalHighlightAlphaTrace"
          ]
          if (
              sweep.get("executed") is not True
              or sweep.get("capturedApplePipelinesUnmodified") is not True
              or sweep.get("glassPrefixSkipped") is not True
              or sweep.get("caseCount") != 8
          ):
              raise SystemExit(f"sweep contract differs: {sweep}")
          for case in sweep.get("cases", []):
              if case.get("executed") is not True:
                  raise SystemExit(f"sweep case failed: {case}")
              records = (
                  (case, "inputFile", 1024 * 1024 * 4),
                  (case["output"], "rawFile", 1024 * 1024 * 4),
                  (
                      case["auxiliaryOutput"],
                      "rawFile",
                      1024 * 1024 * 8,
                  ),
              )
              if case["auxiliaryOutput"].get("pixelFormat") != 115:
                  raise SystemExit(
                      f"auxiliary format differs: {case}"
                  )
              for record, key, expected in records:
                  path = root / record[key]
                  if path.stat().st_size != expected:
                      raise SystemExit(
                          f"{path} size differs: {path.stat().st_size}"
                      )
          if (
              alpha_trace.get("executed") is not True
              or alpha_trace.get("capturedAppleFunctionUnmodified")
                  is not True
              or alpha_trace.get("selectedLastA2XghfcDraw") is not True
          ):
              raise SystemExit(
                  f"alpha-trace contract differs: {alpha_trace}"
              )
          comparison = alpha_trace["capturedVsRebuiltBGRA8"]
          if (
              comparison.get("compared") is not True
              or comparison.get("mismatchedByteCount") != 0
              or comparison.get("maximumChannelDelta") != 0
          ):
              raise SystemExit(
                  "same-format Apple pipeline rebuild is not exact: "
                  f"{comparison}"
              )
          alpha_records = (
              (alpha_trace["capturedBGRA8"], 1024 * 1024 * 4),
              (alpha_trace["rebuiltBGRA8"], 1024 * 1024 * 4),
              (alpha_trace["exactHalfAlpha"], 1024 * 1024 * 8),
              (alpha_trace["exactKeyHalfAlpha"], 1024 * 1024 * 8),
              (alpha_trace["exactFillHalfAlpha"], 1024 * 1024 * 8),
          )
          for replay, expected in alpha_records:
              if replay.get("executed") is not True:
                  raise SystemExit(f"alpha replay failed: {replay}")
              output = replay["output"]
              path = root / output["rawFile"]
              if path.stat().st_size != expected:
                  raise SystemExit(
                      f"{path} size differs: {path.stat().st_size}"
                  )
          alpha_statistics = {}
          for name, key in (
              ("combined", "exactHalfAlpha"),
              ("key", "exactKeyHalfAlpha"),
              ("fill", "exactFillHalfAlpha"),
          ):
              alpha_output = alpha_trace[key]["output"]
              if alpha_output.get("pixelFormat") != 115:
                  raise SystemExit(
                      f"{name} alpha output format differs: "
                      f"{alpha_output}"
                  )
              alpha_path = root / alpha_output["rawFile"]
              alpha_bytes = alpha_path.read_bytes()
              alpha_words = []
              alpha_channel_words = set()
              for red, green, blue, _alpha in struct.iter_unpack(
                  "<4H", alpha_bytes
              ):
                  if red != green or red != blue:
                      raise SystemExit(
                          f"RGBA16F {name} alpha trace does not have "
                          "equal RGB words"
                      )
                  if red:
                      alpha_words.append(red)
                      alpha_channel_words.add(red)
              if (
                  len(alpha_words) < 1000
                  or len(alpha_channel_words) < 100
              ):
                  raise SystemExit(
                      f"RGBA16F {name} alpha trace lacks the expected "
                      f"active field: pixels={len(alpha_words)} "
                      f"values={len(alpha_channel_words)}"
                  )
              alpha_statistics[name] = {
                  "activePixelCount": len(alpha_words),
                  "uniqueWordCount": len(alpha_channel_words),
                  "minimumWord": min(alpha_words),
                  "maximumWord": max(alpha_words),
                  "sha256": hashlib.sha256(alpha_bytes).hexdigest(),
              }
          combined = alpha_statistics["combined"]
          (root / "highlight-pipeline-validation.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 3,
                      "exactContract": True,
                      "caseCount": 8,
                      "capturedApplePipelinesUnmodified": True,
                      "auxiliaryPixelFormat": 115,
                      "capturedVsRebuiltBGRA8MismatchedBytes": 0,
                      "exactHalfAlphaPixelFormat": 115,
                      "exactHalfAlphaActivePixelCount":
                          combined["activePixelCount"],
                      "exactHalfAlphaUniqueWordCount":
                          combined["uniqueWordCount"],
                      "exactHalfAlphaMinimumWord":
                          combined["minimumWord"],
                      "exactHalfAlphaMaximumWord":
                          combined["maximumWord"],
                      "exactHalfAlphaSHA256": combined["sha256"],
                      "bandStatistics": alpha_statistics,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Apple highlight-pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-highlight-pipeline-${{ github.run_id }}
          path: |
            introspection/build.log
            introspection/runtime-stdout.log
            introspection/runtime-stderr.log
            introspection/runtime.json
            introspection/highlight-pipeline-validation.json
            introspection/liquid-glass.gputrace
            introspection/gpudebug/**
            introspection/carenderer-local-backdrop-post-glass-*
            introspection/carenderer-local-backdrop-final-highlight-alpha-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Enforce Apple highlight-pipeline evidence
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test "${{ steps.validate.outcome }}" = success
          test -s introspection/runtime.json
          test -s introspection/highlight-pipeline-validation.json
