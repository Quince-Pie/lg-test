name: Diagnose small-geometry FilterOp and SDFOp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-layer-filter-sdf-small-geometry-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  small_geometry_filter_sdf:
    name: circle-127-light-materialize-instruction-diagnostic
    runs-on: macos-26
    timeout-minutes: 180
    env:
      LG_GLASS_MATERIAL: regular
      LG_GLASS_APPEARANCE: light
      LG_GLASS_GEOMETRY: circle-127-center
      LG_TRANSITION_TIMELINE: "1"
      LG_TRANSITION_DIRECTION: materialize
      LG_TRANSITION_UNIFORMS: "1"
      LG_TRANSITION_CONTROLLED_BACKDROP: "0"
      LG_TRANSITION_ALLOCATION_ONLY: "1"
      LG_TRANSITION_ALLOCATION_DENSE: "1"
      LG_TRANSITION_ALLOCATION_CALIBRATION: "0"
      LG_TRANSITION_ALLOCATION_MESH_CALIBRATION: "0"
      LG_TRANSITION_ALLOCATION_FIXED_STATE: "0"
      LG_TRANSITION_ALLOCATION_PATH_ISOLATION: "0"
      LG_TRANSITION_HIGHLIGHT_TRACE: "0"
      LG_TRANSITION_MATRIX_BASIS: "0"
      LG_PREPARE_LAYER_MASK_CAPTURE_MODE: selected
      LG_PREPARE_LAYER_MASK_INVENTORY_VALIDATION: >-
        Analysis/dynamic_allocation_prepare_layer_mask_instruction_inventory_result.json
      LG_PREPARE_LAYER_CROP_TRANSFER_TRACE_OUTPUT: >-
        transition-filter-sdf-small-geometry/prepare-layer-filter-sdf-small-geometry-trace.json
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Select standard visual accessibility state
        run: |
          defaults write com.apple.universalAccess reduceTransparency -bool false
          defaults write com.apple.universalAccess reduceMotion -bool false
          defaults write com.apple.universalAccess increaseContrast -bool false
          killall cfprefsd 2>/dev/null || true

      - name: Verify frozen small-geometry contracts
        id: contracts
        continue-on-error: true
        run: |
          mkdir -p transition-filter-sdf-small-geometry
          set -o pipefail
          for pattern in \
            test_capture_prepare_layer_crop_transfer_lldb_source.py \
            test_validate_prepare_layer_crop_transfer.py \
            test_capture_prepare_layer_crop_union_operand_lldb_source.py \
            test_capture_prepare_layer_crop_policy_holdout_callback_retry_lldb_source.py \
            test_capture_prepare_layer_mask_instruction_trace_lldb_source.py \
            test_validate_prepare_layer_mask_instruction_inventory.py \
            test_capture_prepare_layer_crop_producer_callee_lldb_source.py \
            test_validate_prepare_layer_crop_producer_callee.py \
            test_capture_prepare_layer_filter_map_bounds_lldb_source.py \
            test_validate_prepare_layer_filter_map_bounds.py \
            test_capture_prepare_layer_filter_map_bounds_regular_lldb_source.py \
            test_validate_prepare_layer_filter_map_bounds_regular_diagnostic.py \
            test_capture_prepare_layer_sdf_map_bounds_diagnostic_lldb_source.py \
            test_validate_prepare_layer_sdf_map_bounds_diagnostic.py \
            test_capture_prepare_layer_sdf_map_bounds_diagnostic_callback_retry_lldb_source.py \
            test_capture_prepare_layer_filter_sdf_small_geometry_lldb_source.py \
            test_validate_prepare_layer_filter_sdf_small_geometry.py \
            test_dynamic_allocation_prepare_layer_filter_sdf_small_geometry_preregistration.py
          do
            python3 -m unittest discover -s Analysis -p "$pattern" -v 2>&1 |
              tee -a transition-filter-sdf-small-geometry/contracts.log
          done

      - name: Build transition introspection probe
        id: build
        if: steps.contracts.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcrun clang \
            -std=c23 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -target "$(uname -m)-apple-macos26.0" \
            -c Sources/GlassIntrospect/MatrixBridge.c \
            -o transition-filter-sdf-small-geometry/MatrixBridge.o 2>&1 |
            tee transition-filter-sdf-small-geometry/build.log
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            -import-objc-header Sources/GlassIntrospect/MatrixBridge.h \
            Sources/GlassIntrospect/HalfBlendProbe.swift \
            Sources/GlassIntrospect/HalfDotProbe.swift \
            Sources/GlassIntrospect/HalfIntrinsicProbe.swift \
            Sources/GlassIntrospect/SDFStageProbe.swift \
            Sources/GlassIntrospect/main.swift \
            transition-filter-sdf-small-geometry/MatrixBridge.o \
            -o glass-transition-introspect 2>&1 |
            tee -a transition-filter-sdf-small-geometry/build.log

      - name: Capture output-blind small-geometry Filter and SDF execution
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          xcrun lldb --batch \
            -o 'settings set target.output-path transition-filter-sdf-small-geometry/runtime-stdout.log' \
            -o 'settings set target.error-path transition-filter-sdf-small-geometry/runtime-stderr.log' \
            -o 'command script import Analysis/capture_prepare_layer_filter_sdf_small_geometry_lldb.py' \
            -o run \
            -o 'script capture_prepare_layer_filter_sdf_small_geometry_lldb.trace_selected_sdf_filter_map_bounds()' \
            -o 'script capture_prepare_layer_filter_sdf_small_geometry_lldb.finalize()' \
            -- ./glass-transition-introspect transition-filter-sdf-small-geometry \
            > transition-filter-sdf-small-geometry/lldb-filter-sdf.log 2>&1

      - name: Validate small-geometry instruction diagnostic
        id: validate
        if: >-
          steps.build.outcome == 'success' &&
          steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          python3 Analysis/validate_prepare_layer_filter_sdf_small_geometry.py \
            transition-filter-sdf-small-geometry/prepare-layer-filter-sdf-small-geometry-trace.json \
            transition-filter-sdf-small-geometry/transition-timeline.json \
            Analysis/dynamic_allocation_prepare_layer_mask_instruction_inventory_result.json \
            --output transition-filter-sdf-small-geometry/filter-sdf-small-geometry-validation.json

      - name: Upload complete small-geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            liquid-glass-prepare-layer-filter-sdf-small-geometry-${{ github.run_id }}
          path: transition-filter-sdf-small-geometry
          if-no-files-found: error
          retention-days: 7

      - name: Enforce small-geometry instruction diagnostic
        if: always()
        run: |
          test "${{ steps.contracts.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test "${{ steps.validate.outcome }}" = success
          test -s transition-filter-sdf-small-geometry/filter-sdf-small-geometry-validation.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  "transition-filter-sdf-small-geometry/"
                  "filter-sdf-small-geometry-validation.json"
              ).read_text(encoding="utf-8")
          )
          profile = result.get("profile", {})
          selection = result.get("selection", {})
          target = result.get("filter", {})
          sdf = result.get("sdf", {})
          diagnostic = result.get("smallGeometryDiagnostic", {})
          sealed = result.get("sealedConclusion", {})
          if (
              result.get(
                  "prepareLayerFilterSDFSmallGeometryValidationSchemaVersion"
              ) != 1
              or result.get("conclusion") != "success"
              or profile != {
                  "material": "regular",
                  "appearance": "light",
                  "direction": "materialize",
                  "geometry": "circle-127-center",
                  "backingScaleFactor": 1,
              }
              or selection.get("markerInterval") != 2
              or selection.get("qualifiedHelperOrdinal") != 14
              or selection.get("dynamicCallOffset") != 0x2864
              or selection.get("dispatchOrdinal") != 4
              or selection.get("cropValuesUsedForSelection") is not False
              or selection.get("outputValuesUsedForSelection") is not False
              or target.get("codeSHA256")
              != "e8766dcefdadc0074f7bb4e2bf62955072891858009dca6c72a7eef1c96789d0"
              or target.get("filterInstructionCount", 0) <= 0
              or sdf.get("relativeToPrepareLayer") != -56012
              or sdf.get("symbolByteCount") != 160
              or sdf.get("discoveredCodeSHA256")
              != "1db9b60701304250a5784288bfa03136ab74db137eb021428d0fad7fa87b01ae"
              or sdf.get("instructionCount", 0) <= 0
              or sdf.get("changedQwordOffsets") != [0, 8, 16, 24]
              or sdf.get("completeInstructionChainValidated") is not True
              or diagnostic.get("geometry") != "circle-127-center"
              or diagnostic.get("selectedSampleIndex") != 2
              or diagnostic.get("filterAndSDFSelectorsChanged") is not False
              or diagnostic.get("cropOrOutputValuesUsedForSelection") is not False
              or diagnostic.get("sourceDODCandidateAcceptedBeforeCapture") is not False
              or sealed.get("smallGeometryFilterSDFDiagnosticPassed") is not True
              or sealed.get("regularGeometryTransferPassed") is not False
              or sealed.get("productionShaderAuthorized") is not False
              or sealed.get("liquidGlassParityEstablished") is not False
          ):
              raise SystemExit("small-geometry Filter/SDF diagnostic differs")
          PY
