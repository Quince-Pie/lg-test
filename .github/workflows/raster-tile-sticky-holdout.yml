name: Test Apple Metal sticky-carry coefficient model

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/raster-tile-sticky-holdout.yml
      - Analysis/open_raster_tile_sticky_holdout.py
      - Analysis/raster_tile_coefficient_model_v2.py
      - Analysis/raster_tile_iterator_model_v2.py
      - Analysis/raster_tile_sticky_holdout_model.py
      - Analysis/raster_tile_sticky_holdout_predictions.zlib
      - Analysis/raster_tile_sticky_holdout_preregistration.json
      - Analysis/test_raster_tile_coefficient_model_v2.py
      - Analysis/test_validate_raster_tile_sticky_holdout.py
      - Analysis/validate_raster_tile_sticky_holdout.py
      - Sources/GlassRasterTileNumerator/**

concurrency:
  group: raster-tile-sticky-holdout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-tile-sticky-holdout:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Test frozen sticky-carry contract
        run: |
          python3 -m unittest discover -s Analysis \
            -p 'test_raster_tile_coefficient_model_v2.py' -v
          python3 -m unittest discover -s Analysis \
            -p 'test_validate_raster_tile_sticky_holdout.py' -v

      - name: Build sticky-carry holdout probe
        id: build
        continue-on-error: true
        run: |
          mkdir -p raster-tile-sticky-holdout
          set -o pipefail
          swiftc -D TILE_STICKY_COEFFICIENT_HOLDOUT -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            Sources/GlassRasterTileNumerator/main.swift \
            -o glass-raster-tile-sticky-holdout 2>&1 |
            tee raster-tile-sticky-holdout/build.log

      - name: Capture unseen sticky-carry records
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          SWIFT_BACKTRACE: enable
        run: |
          ./glass-raster-tile-sticky-holdout \
            raster-tile-sticky-holdout

      - name: Validate capture structure without opening predictions
        id: validate
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          python3 Analysis/validate_raster_tile_sticky_holdout.py \
            raster-tile-sticky-holdout \
            --output raster-tile-sticky-holdout/validation.json

      - name: Compare every captured word with committed predictions
        id: opening
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: |
          python3 Analysis/open_raster_tile_sticky_holdout.py \
            raster-tile-sticky-holdout \
            --output raster-tile-sticky-holdout/holdout-opening.json

      - name: Upload sticky-carry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-raster-tile-sticky-holdout-${{ github.run_id }}
          path: raster-tile-sticky-holdout
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exact sticky-carry holdout
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test "${{ steps.validate.outcome }}" = success
          test "${{ steps.opening.outcome }}" = success
          test -s raster-tile-sticky-holdout/manifest.json
          test -s raster-tile-sticky-holdout/validation.json
          test -s raster-tile-sticky-holdout/holdout-opening.json
          test -s raster-tile-sticky-holdout/raster-tile-numerator.raw
