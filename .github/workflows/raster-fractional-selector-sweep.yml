name: Calibrate Apple Metal exhaustive fractional selector

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/raster-fractional-selector-sweep.yml
      - Analysis/build_raster_fractional_selector_witness_map.py
      - Analysis/model_raster_general_height_arithmetic.py
      - Analysis/raster_fractional_selector_sweep_preregistration.json
      - Analysis/raster_fractional_selector_witness_indices.bin
      - Analysis/raster_fractional_selector_witness_map.json
      - Analysis/raster_general_height_resolved_selectors.zlib
      - Analysis/requirements-fractional-selector.txt
      - Analysis/validate_raster_fractional_selector_sweep.py
      - Sources/GlassRasterFractionalSelectorSweep/**

concurrency:
  group: raster-fractional-selector-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-fractional-selector-sweep:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Analysis/requirements-fractional-selector.txt

      - name: Install selector validator dependency
        run: |
          python -m pip install --disable-pip-version-check \
            -r Analysis/requirements-fractional-selector.txt

      - name: Build exhaustive fractional-selector probe
        id: build
        continue-on-error: true
        run: |
          mkdir -p raster-fractional-selector-sweep
          set -o pipefail
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            Sources/GlassRasterFractionalSelectorSweep/main.swift \
            -o glass-raster-fractional-selector-sweep 2>&1 |
            tee raster-fractional-selector-sweep/build.log

      - name: Measure every fractional-width selector mantissa
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          SWIFT_BACKTRACE: enable
        run: |
          ./glass-raster-fractional-selector-sweep \
            raster-fractional-selector-sweep

      - name: Validate sealed controls and exhaustive selector table
        id: validate
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          python Analysis/validate_raster_fractional_selector_sweep.py \
            raster-fractional-selector-sweep \
            --output raster-fractional-selector-sweep/validation.json \
            --selector-output \
              raster-fractional-selector-sweep/resolved-selectors-u32le.zlib

      - name: Upload exhaustive fractional-selector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-raster-fractional-selector-sweep-${{ github.run_id }}
          path: raster-fractional-selector-sweep
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exhaustive fractional-selector gate
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test "${{ steps.validate.outcome }}" = success
          test -s raster-fractional-selector-sweep/manifest.json
          test -s raster-fractional-selector-sweep/validation.json
          test -s \
            raster-fractional-selector-sweep/resolved-selectors-u32le.zlib
