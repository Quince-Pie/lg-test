name: Capture Landmark Liquid Glass Reference

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  capture-landmark:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Select standard visual accessibility state
        run: |
          defaults write com.apple.universalAccess reduceTransparency -bool false
          defaults write com.apple.universalAccess reduceMotion -bool false
          defaults write com.apple.universalAccess increaseContrast -bool false
          killall cfprefsd 2>/dev/null || true
          sleep 2

      - name: Build GlassCapture
        run: |
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            Sources/GlassCapture/main.swift \
            -o glasscap

      - name: Capture Native Apple macOS 26 Landmark Framebuffer
        run: |
          mkdir -p artifacts/landmark_captures
          ./glasscap --out artifacts/landmark_captures --suite static --width 3200 --height 2000

      - name: Upload Landmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: landmark-native-hardware-captures
          path: artifacts/landmark_captures/
