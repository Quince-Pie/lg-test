name: Calibrate Apple Metal square selector

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/raster-square-selector-sweep.yml
      - Analysis/raster_square_selector_sweep_preregistration.json
      - Analysis/validate_raster_square_selector_sweep.py
      - Sources/GlassRasterSquareSelectorSweep/**

concurrency:
  group: raster-square-selector-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-square-selector-sweep:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Analysis/requirements-fractional-selector.txt

      - name: Install validator dependency
        run: |
          python -m pip install --disable-pip-version-check \
            -r Analysis/requirements-fractional-selector.txt

      - name: Build square-selector probe
        id: build
        continue-on-error: true
        run: |
          mkdir -p raster-square-selector-sweep
          set -o pipefail
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            Sources/GlassRasterSquareSelectorSweep/main.swift \
            -o glass-raster-square-selector-sweep 2>&1 |
            tee raster-square-selector-sweep/build.log

      - name: Capture every production-range square selector
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          SWIFT_BACKTRACE: enable
        run: |
          ./glass-raster-square-selector-sweep \
            raster-square-selector-sweep

      - name: Resolve exact selector endpoints
        id: validate
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          python Analysis/validate_raster_square_selector_sweep.py \
            raster-square-selector-sweep \
            --output raster-square-selector-sweep/validation.json

      - name: Upload square-selector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-raster-square-selector-sweep-${{ github.run_id }}
          path: raster-square-selector-sweep
          if-no-files-found: error
          retention-days: 7

      - name: Enforce square-selector calibration gate
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test "${{ steps.validate.outcome }}" = success
          test -s raster-square-selector-sweep/manifest.json
          test -s raster-square-selector-sweep/validation.json
          test -s \
            raster-square-selector-sweep/raster-square-selectors-u32le.zlib
          test -s \
            raster-square-selector-sweep/raster-square-selector-offsets-i8.bin
