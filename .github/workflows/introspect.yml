name: Inspect Liquid Glass runtime

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/introspect.yml
      - Sources/GlassIntrospect/**

concurrency:
  group: introspect-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  introspect:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS 26+
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Select standard visual accessibility state
        run: |
          defaults write com.apple.universalAccess reduceTransparency -bool false
          defaults write com.apple.universalAccess reduceMotion -bool false
          defaults write com.apple.universalAccess increaseContrast -bool false
          killall cfprefsd 2>/dev/null || true

      - name: Build Liquid Glass introspection probe
        id: build
        continue-on-error: true
        run: |
          mkdir -p introspection
          set -o pipefail
          xcrun clang \
            -std=c23 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -target "$(uname -m)-apple-macos26.0" \
            -c Sources/GlassIntrospect/MatrixBridge.c \
            -o introspection/MatrixBridge.o 2>&1 |
            tee introspection/build.log
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos26.0" \
            -import-objc-header Sources/GlassIntrospect/MatrixBridge.h \
            Sources/GlassIntrospect/HalfBlendProbe.swift \
            Sources/GlassIntrospect/HalfDotProbe.swift \
            Sources/GlassIntrospect/HalfIntrinsicProbe.swift \
            Sources/GlassIntrospect/SDFStageProbe.swift \
            Sources/GlassIntrospect/main.swift \
            introspection/MatrixBridge.o \
            -o glassintrospect 2>&1 |
            tee -a introspection/build.log

      - name: Probe real Liquid Glass render pipeline
        if: always()
        continue-on-error: true
        env:
          MTL_CAPTURE_ENABLED: "1"
          LG_EXECUTE_INDEPENDENT_GLASS: "1"
        run: |
          if [ "${{ steps.build.outcome }}" = success ]; then
            python3 - <<'PY'
          import json
          import pathlib
          import shutil
          import subprocess

          error_path = pathlib.Path("introspection/runtime-error.json")
          stdout_path = pathlib.Path("introspection/runtime-stdout.log")
          stderr_path = pathlib.Path("introspection/runtime-stderr.log")
          try:
              with stdout_path.open("wb") as stdout_stream, \
                   stderr_path.open("wb") as stderr_stream:
                  result = subprocess.run(
                      ["./glassintrospect", "introspection"],
                      check=False,
                      timeout=180,
                      stdout=stdout_stream,
                      stderr=stderr_stream,
                  )
              if result.returncode != 0:
                  error_path.write_text(
                      json.dumps(
                          {
                              "error": "introspection app exited nonzero",
                              "returnCode": result.returncode,
                          },
                          indent=2,
                          sort_keys=True,
                      )
                      + "\n",
                      encoding="utf-8",
                  )
          except subprocess.TimeoutExpired:
              error_path.write_text(
                  json.dumps(
                      {
                          "error": "introspection app exceeded deadline",
                          "timeoutSeconds": 180,
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
          diagnostic_root = (
              pathlib.Path.home()
              / "Library"
              / "Logs"
              / "DiagnosticReports"
          )
          if diagnostic_root.is_dir():
              for diagnostic in sorted(
                  diagnostic_root.glob("glassintrospect*")
              ):
                  if diagnostic.is_file():
                      shutil.copy2(
                          diagnostic,
                          pathlib.Path("introspection")
                          / f"crash-{diagnostic.name}",
                      )
          PY
          else
            echo "introspection app did not build" \
              > introspection/runtime-error.txt
          fi

          framework_output="introspection/framework-evidence.txt"
          {
            for binary in \
              /System/Library/Frameworks/SwiftUI.framework/Versions/A/SwiftUI \
              /System/Library/Frameworks/QuartzCore.framework/Versions/A/QuartzCore \
              /System/Library/Frameworks/CoreImage.framework/Versions/A/CoreImage \
              /System/Library/PrivateFrameworks/CoreMaterial.framework/Versions/A/CoreMaterial
            do
              echo "BINARY $binary"
              string_evidence="$RUNNER_TEMP/$(basename "$binary").strings"
              strings -a "$binary" 2>/dev/null |
                grep -Ei 'liquid.?glass|glass.?effect|glassBackground|backdrop|gaussian|blur|color.?matrix|vibrant|downsample|upsample|sdf|portal' |
                sort -u > "$string_evidence" || true
              if xcrun --find swift-demangle >/dev/null 2>&1; then
                xcrun swift-demangle < "$string_evidence" |
                  head -n 400 || true
              else
                head -n 400 "$string_evidence" || true
              fi

              symbol_evidence="$RUNNER_TEMP/$(basename "$binary").symbols"
              nm -gjU "$binary" 2>/dev/null |
                grep -Ei 'glass|backdrop|gaussian|blur|vibrant|matrix|sdf|portal' |
                sort -u > "$symbol_evidence" || true
              if xcrun --find swift-demangle >/dev/null 2>&1; then
                xcrun swift-demangle < "$symbol_evidence" |
                  head -n 400 || true
              else
                head -n 400 "$symbol_evidence" || true
              fi

              echo "DYLD EXPORTS $binary"
              xcrun dyld_info -exports "$binary" 2>/dev/null |
                grep -Ei 'glass|material|backdrop|gaussian|blur|vibrant|matrix|sdf|holding|tone' |
                head -n 800 || true
            done
          } > "$framework_output"

      - name: Inventory Apple Metal renderer assets
        if: always()
        continue-on-error: true
        run: |
          output="introspection/metal-inventory.txt"
          {
            echo "DEVELOPER TOOLS"
            for tool in \
              metal \
              metal-ar \
              metal-objdump \
              metal-nm \
              metallib \
              llvm-dis \
              llvm-objdump
            do
              printf '%s: ' "$tool"
              xcrun --find "$tool" 2>&1 || true
            done

            echo "METAL ASSETS"
            find \
              /System/Library/Frameworks \
              /System/Library/PrivateFrameworks \
              /System/Library/CoreServices/WindowServer.app \
              -type f \
              \( \
                -iname '*.air' \
                -o -iname '*.metalarc' \
                -o -iname '*.metallib' \
                -o -iname '*metal*.bin' \
              \) \
              -print 2>/dev/null |
              sort |
              while IFS= read -r asset
              do
                stat -f 'FILE %z %N' "$asset"
                shasum -a 256 "$asset"
                strings -a "$asset" 2>/dev/null |
                  grep -Ei \
                    'glass|backdrop|holding.?tone|face.?color|refraction|bleed|vibrant|sdf' |
                  sort -u |
                  head -n 120 || true
              done

            echo "MACH-O METAL SECTIONS"
            for binary in \
              /System/Library/Frameworks/QuartzCore.framework/Versions/A/QuartzCore \
              /System/Library/PrivateFrameworks/CoreMaterial.framework/Versions/A/CoreMaterial \
              /System/Library/PrivateFrameworks/RenderBox.framework/Versions/A/RenderBox \
              /System/Library/CoreServices/WindowServer.app/Contents/MacOS/WindowServer
            do
              test -f "$binary" || continue
              echo "BINARY $binary"
              otool -l "$binary" 2>/dev/null |
                grep -E \
                  '(^Load command|cmd |segname |sectname |offset |size |filesize )' ||
                true
            done
          } > "$output"

      - name: Probe QuartzCore Liquid Glass Metal library
        if: always()
        continue-on-error: true
        run: |
          library="/System/Library/Frameworks/QuartzCore.framework/Versions/A/Resources/default.metallib"
          output="introspection/quartzcore-metal-tools.txt"

          capture() {
            label="$1"
            shift
            temporary="$RUNNER_TEMP/metal-probe-$(printf '%s' "$label" | tr -c '[:alnum:]' '-').txt"
            if "$@" > "$temporary" 2>&1; then
              status=0
            else
              status=$?
            fi
            echo "PROBE $label"
            echo "EXIT $status"
            stat -f 'BYTES %z' "$temporary"
            sed -n '1,500p' "$temporary"
          }

          capture_filtered() {
            label="$1"
            shift
            temporary="$RUNNER_TEMP/metal-probe-$(printf '%s' "$label" | tr -c '[:alnum:]' '-').txt"
            if "$@" > "$temporary" 2>&1; then
              status=0
            else
              status=$?
            fi
            echo "PROBE $label"
            echo "EXIT $status"
            stat -f 'BYTES %z' "$temporary"
            grep -Ei \
              'glass|backdrop|holding.?tone|face.?cm|bleed.?cm|shadow.?cm|sdf' \
              "$temporary" |
              head -n 1000 || true
          }

          {
            test -f "$library"
            file "$library"
            stat -f 'LIBRARY BYTES %z' "$library"
            shasum -a 256 "$library"
            od -An -tx1 -N64 "$library"

            capture metal-nm-help xcrun metal-nm --help
            capture metal-objdump-help xcrun metal-objdump --help
            capture metallib-help xcrun metallib --help
            capture metallib-short-help xcrun metallib -h

            capture_filtered metal-nm xcrun metal-nm "$library"
            capture_filtered metal-nm-all xcrun metal-nm -a "$library"
            capture_filtered metal-objdump-syms \
              xcrun metal-objdump --syms "$library"
            capture_filtered metal-objdump-table \
              xcrun metal-objdump -t "$library"
            capture_filtered metal-objdump-section-headers \
              xcrun metal-objdump --section-headers "$library"
            capture_filtered metal-objdump-headers \
              xcrun metal-objdump -h "$library"

            capture metal-objdump-metallib-syms \
              xcrun metal-objdump --metallib --syms "$library"
            capture metal-objdump-metallib-reflection \
              xcrun metal-objdump --metallib --reflection "$library"
            capture metal-objdump-metallib-script \
              xcrun metal-objdump --metallib --script "$library"
            capture metal-objdump-metallib-build-tables \
              xcrun metal-objdump --metallib --build-table=all "$library"
            capture metal-objdump-metallib-compressed-sections \
              xcrun metal-objdump --metallib --compressed-sections "$library"
            capture metal-objdump-glass-background-air-version \
              xcrun metal-objdump \
                --metallib \
                --air-version=glass_background_lph \
                "$library"
            capture metal-objdump-glass-background-lph \
              xcrun metal-objdump \
                --metallib \
                --disassemble-symbols=glass_background_lph \
                --print-imm-hex \
                "$library"

            capture lipo-architectures lipo -archs "$library"
            air_slice="introspection/quartzcore-air64.metallib"
            python3 - "$library" "$air_slice" <<'PY'
          import pathlib
          import struct
          import sys

          source = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          with source.open("rb") as stream:
              magic, count = struct.unpack(">II", stream.read(8))
              if magic == 0x4D544C42:
                  stream.seek(0)
                  payload = stream.read()
                  destination.write_bytes(payload)
                  print(
                      "AIR64 DIRECT MTLB "
                      f"size={len(payload)}"
                  )
                  raise SystemExit(0)
              if magic != 0xCAFEBABE:
                  raise SystemExit(f"unexpected fat magic: 0x{magic:08x}")
              selected = None
              for _ in range(count):
                  cpu_type, cpu_subtype, offset, size, alignment = struct.unpack(
                      ">IIIII", stream.read(20)
                  )
                  if cpu_type == 0x01000017:
                      selected = (cpu_subtype, offset, size, alignment)
              if selected is None:
                  raise SystemExit("air64 architecture is absent")
              cpu_subtype, offset, size, alignment = selected
              stream.seek(offset)
              payload = stream.read(size)
              if len(payload) != size:
                  raise SystemExit("short read extracting air64 architecture")
          destination.write_bytes(payload)
          print(
              "AIR64 FAT ENTRY "
              f"subtype={cpu_subtype} offset={offset} "
              f"size={size} alignment={alignment}"
          )
          PY

            if test -s "$air_slice"; then
              file "$air_slice"
              stat -f 'AIR64 BYTES %z' "$air_slice"
              shasum -a 256 "$air_slice"
              capture air64-metal-nm xcrun metal-nm "$air_slice"
              capture air64-metal-nm-sizes \
                xcrun metal-nm --print-size --size-sort "$air_slice"
              capture air64-reflection \
                xcrun metal-objdump --metallib --reflection "$air_slice"
              air_ir="introspection/quartzcore-air64-glass-background-lph.ll"
              air_error="introspection/quartzcore-air64-glass-background-lph.stderr"
              if xcrun metal-objdump \
                  --metallib \
                  --disassemble-symbols=glass_background_lph \
                  --print-imm-hex \
                  "$air_slice" > "$air_ir" 2> "$air_error"
              then
                echo "AIR64 DISASSEMBLY EXIT 0"
              else
                echo "AIR64 DISASSEMBLY EXIT $?"
              fi
              stat -f 'AIR64 IR BYTES %z' "$air_ir"
              shasum -a 256 "$air_ir"
              sed -n '1,200p' "$air_error"

              for symbol in \
                downsample_4_frag_lpf \
                downsample_4_frag_lph \
                downsample_6_frag_lpf \
                downsample_6_frag_lph \
                downsample_8_frag_lpf \
                downsample_8_frag_lph \
                downsample_blur_2_frag_lpf \
                downsample_blur_2_frag_lph \
                downsample_blur_4_frag_lpf \
                downsample_blur_4_frag_lph \
                downsample_blur_vert_lpf \
                downsample_blur_vert_lph \
                variable_blur_downsample_frag_lpf \
                variable_blur_downsample_frag_lph \
                variable_blur_clamp_downsample_frag_lpf \
                variable_blur_clamp_downsample_frag_lph \
                variable_blur_downsample_compute \
                variable_blur_downsample_compute_agx2 \
                tile_downsample_1 \
                tile_downsample_2 \
                tile_downsample_4 \
                tile_downsample_8
              do
                symbol_ir="introspection/quartzcore-air64-${symbol}.ll"
                symbol_error="introspection/quartzcore-air64-${symbol}.stderr"
                if xcrun metal-objdump \
                    --metallib \
                    --disassemble-symbols="$symbol" \
                    --print-imm-hex \
                    "$air_slice" > "$symbol_ir" 2> "$symbol_error"
                then
                  symbol_status=0
                else
                  symbol_status=$?
                fi
                echo "AIR64 SYMBOL $symbol"
                echo "AIR64 SYMBOL EXIT $symbol_status"
                stat -f 'AIR64 SYMBOL IR BYTES %z' "$symbol_ir"
                shasum -a 256 "$symbol_ir"
                sed -n '1,80p' "$symbol_error"
              done
            else
              echo "AIR64 EXTRACTION FAILED"
            fi

            function_slice="introspection/quartzcore-glass-background-lph.metallib"
            if xcrun metallib \
              "$air_slice" \
              --function-name=glass_background_lph \
              -o "$function_slice"
            then
              file "$function_slice"
              stat -f 'FUNCTION BYTES %z' "$function_slice"
              shasum -a 256 "$function_slice"
              capture function-metal-nm xcrun metal-nm "$function_slice"
              capture function-reflection \
                xcrun metal-objdump --metallib --reflection "$function_slice"
              capture function-disassembly \
                xcrun metal-objdump \
                  --metallib \
                  --disassemble-symbols=glass_background_lph \
                  --print-imm-hex \
                  "$function_slice"
            else
              echo "FUNCTION EXTRACTION FAILED"
            fi
          } > "$output"

      - name: Disassemble Apple reduction and mip-filter kernels
        if: always()
        continue-on-error: true
        run: |
          library="/System/Library/Frameworks/CoreImage.framework/Versions/A/Resources/ci_filters.metallib"
          air_slice="introspection/coreimage-air64.metallib"
          output="introspection/coreimage-reduction-kernels.txt"

          python3 - "$library" "$air_slice" <<'PY'
          import pathlib
          import struct
          import sys

          source = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          with source.open("rb") as stream:
              magic, count = struct.unpack(">II", stream.read(8))
              if magic == 0x4D544C42:
                  stream.seek(0)
                  payload = stream.read()
                  destination.write_bytes(payload)
                  print(
                      "AIR64 DIRECT MTLB "
                      f"size={len(payload)}"
                  )
                  raise SystemExit(0)
              if magic != 0xCAFEBABE:
                  raise SystemExit(f"unexpected fat magic: 0x{magic:08x}")
              selected = None
              for _ in range(count):
                  cpu_type, cpu_subtype, offset, size, alignment = struct.unpack(
                      ">IIIII", stream.read(20)
                  )
                  if cpu_type == 0x01000017:
                      selected = (cpu_subtype, offset, size, alignment)
              if selected is None:
                  raise SystemExit("air64 architecture is absent")
              cpu_subtype, offset, size, alignment = selected
              stream.seek(offset)
              payload = stream.read(size)
              if len(payload) != size:
                  raise SystemExit("short read extracting air64 architecture")
          destination.write_bytes(payload)
          print(
              "AIR64 FAT ENTRY "
              f"subtype={cpu_subtype} offset={offset} "
              f"size={size} alignment={alignment}"
          )
          PY

          {
            file "$library"
            stat -f 'LIBRARY BYTES %z' "$library"
            shasum -a 256 "$library"
            file "$air_slice"
            stat -f 'AIR64 BYTES %z' "$air_slice"
            shasum -a 256 "$air_slice"
            echo "MATCHED SYMBOLS"
            xcrun metal-nm "$air_slice" 2>&1 |
              grep -E \
                'gaussianReduce|ASG[hv]|asgDown|lanczosDown|betterDown2|CIPyramidGenerateLevel|downhalf|areaAvg2|cubicDownsample2' ||
              true
            echo "REFLECTION"
            xcrun metal-objdump \
              --metallib \
              --reflection \
              "$air_slice" 2>&1 |
              grep -E \
                'gaussianReduce|ASG[hv]|asgDown|lanczosDown|betterDown2|CIPyramidGenerateLevel|downhalf|areaAvg2|cubicDownsample2' ||
              true
          } > "$output"

          for symbol in \
            gaussianReduce4o \
            gaussianReduce4 \
            gaussianReduce2o \
            gaussianReduce2 \
            ASGh50 \
            ASGv50 \
            ASGh60 \
            ASGv60 \
            ASGh66 \
            ASGv66 \
            ASGh75 \
            ASGv75 \
            ASGh80 \
            ASGv80 \
            asgDownH \
            asgDownV \
            lanczosDown2 \
            lanczosDownH \
            lanczosDownV \
            betterDown2 \
            CIPyramidGenerateLevel \
            downhalf \
            areaAvg2 \
            cubicDownsample2
          do
            ir="introspection/coreimage-air64-${symbol}.ll"
            error="introspection/coreimage-air64-${symbol}.stderr"
            if xcrun metal-objdump \
                --metallib \
                --disassemble-symbols="$symbol" \
                --print-imm-hex \
                "$air_slice" > "$ir" 2> "$error"
            then
              status=0
            else
              status=$?
            fi
            {
              echo "SYMBOL $symbol"
              echo "EXIT $status"
              stat -f 'IR BYTES %z' "$ir"
              shasum -a 256 "$ir"
              sed -n '1,80p' "$error"
            } >> "$output"
          done

      - name: Disassemble exported Apple color-matrix routines
        if: always()
        continue-on-error: true
        run: |
          output="introspection/matrix-disassembly.txt"
          python3 <<'PY' > "$output"
          import json
          import subprocess

          with open("introspection/runtime.json", encoding="utf-8") as stream:
              report = json.load(stream)

          groups = (
              ("EXPORTED", report.get("exportedCode", [])),
              ("RUNTIME METHOD", report.get("runtimeMethodCode", [])),
          )
          for group, records in groups:
              for record in records:
                  print(f"{group} RECORD")
                  for key in (
                      "symbol",
                      "class",
                      "selector",
                      "imagePath",
                      "imageBase",
                      "imageOffset",
                      "runtimeAddress",
                      "resolvedName",
                      "resolvedAddress",
                      "requestedByteCount",
                      "error",
                  ):
                      if key in record:
                          print(f"{key}={record[key]}")
                  encoded = record.get("hex")
                  if not encoded:
                      print("NO INSTRUCTION BYTES")
                      continue

                  command = [
                      "xcrun",
                      "llvm-mc",
                      "--disassemble",
                      "--hex",
                      "--triple=arm64e-apple-macos26.0",
                      "--print-imm-hex",
                  ]
                  result = subprocess.run(
                      command,
                      input=encoded,
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  print(f"LLVM-MC EXIT {result.returncode}")
                  print(result.stdout, end="")
                  if result.stderr:
                      print("LLVM-MC STDERR")
                      print(result.stderr, end="")
          PY

      - name: Upload Liquid Glass introspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-introspection-${{ github.run_id }}
          path: introspection
          if-no-files-found: error
          retention-days: 7

      - name: Enforce introspection
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test -s introspection/runtime.json
          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path("introspection")
          with (root / "runtime.json").open(encoding="utf-8") as stream:
              runtime = json.load(stream)
          if runtime.get("schemaVersion") != 68:
              raise SystemExit("introspection schema is not 68")

          background = runtime.get("diagnosticBackgroundEvidence", {})
          if (
              background.get("pattern")
              != "coordinate-hash-rgb-1x1-cells-v1"
              or background.get("cellWidthPoints") != 1
              or background.get("cellHeightPoints") != 1
              or background.get("columns") != 1024
              or background.get("rows") != 1024
          ):
              raise SystemExit(
                  "schema-68 diagnostic background metadata differs"
              )

          install = runtime.get("sdfGeneratorEvidence", {}).get(
              "metalUniformProbeInstall", {}
          )
          required_metal_selectors = {
              "newComputePipelineStateWithFunction:error:",
              "computeCommandEncoder",
              "computeCommandEncoderWithDispatchType:",
              "computeCommandEncoderWithDescriptor:",
              "blitCommandEncoder",
              "blitCommandEncoderWithDescriptor:",
              "setComputePipelineState:",
              "setBytes:length:atIndex:",
              "setBuffer:offset:atIndex:",
              "setBufferOffset:atIndex:",
              "setTexture:atIndex:",
              "setSamplerState:atIndex:",
              "setImageblockWidth:height:",
              "dispatchThreadgroups:threadsPerThreadgroup:",
              "dispatchThreads:threadsPerThreadgroup:",
              "generateMipmapsForTexture:",
          }
          installed_metal_selectors = {
              method.get("selector")
              for method in install.get("methods", [])
              if isinstance(method, dict)
          }
          if (
              install.get("installed") is not True
              or install.get("missingRequiredSelectors") != []
              or not required_metal_selectors.issubset(
                  installed_metal_selectors
              )
          ):
              raise SystemExit(
                  "schema-68 Metal command-provenance hooks differ: "
                  f"{install}"
              )

          command_provenance = runtime.get(
              "carendererEvidence", {}
          ).get("metalCommandProvenance", {})
          count_keys = (
              "capturedRecordCount",
              "computeEncoderCount",
              "computePipelineCount",
              "dispatchThreadgroupsCount",
              "dispatchThreadsCount",
              "blitEncoderCount",
              "generateMipmapsCount",
          )
          if (
              command_provenance.get("schemaVersion") != 1
              or command_provenance.get("capture")
                  != "carenderer-live-tree"
              or not isinstance(
                  command_provenance.get("records"), list
              )
              or any(
                  not isinstance(command_provenance.get(key), int)
                  or command_provenance[key] < 0
                  for key in count_keys
              )
              or command_provenance["capturedRecordCount"]
                  != len(command_provenance["records"])
              or command_provenance["blitEncoderCount"] < 1
          ):
              raise SystemExit(
                  "schema-68 Metal command provenance differs: "
                  f"{command_provenance}"
              )

          downsample = runtime.get(
              "variableBlurDownsampleEvidence", {}
          )
          candidates = downsample.get("candidates", [])
          candidate_names = {
              candidate.get("function")
              for candidate in candidates
              if isinstance(candidate, dict)
          }
          if (
              downsample.get("schemaVersion") != 2
              or downsample.get("executed") is not True
              or downsample.get("uniformLayoutBytes") != 16
              or candidate_names
              != {
                  "variable_blur_downsample_compute_agx2",
                  "variable_blur_downsample_compute",
              }
          ):
              raise SystemExit(
                  "schema-68 native downsample replay metadata differs"
              )
          candidates_by_name = {
              candidate["function"]: candidate
              for candidate in candidates
          }
          for name, candidate in candidates_by_name.items():
              half_trace = candidate.get("halfTrace", {})
              if (
                  candidate.get("executed") is not True
                  or candidate.get("outputBytes") != 224 * 224 * 4
                  or half_trace.get("executed") is not True
                  or half_trace.get("outputBytes") != 224 * 224 * 8
              ):
                  raise SystemExit(
                      "schema-68 native downsample candidate failed: "
                      f"{name}: {candidate}"
                  )
              for record in (candidate, half_trace):
                  path = root / str(record.get("outputFile", ""))
                  if (
                      not path.is_file()
                      or path.stat().st_size
                          != record.get("outputBytes")
                  ):
                      raise SystemExit(
                          "schema-68 native downsample payload differs: "
                          f"{path}"
                      )

          in_place = downsample.get("inPlaceCandidates", [])
          expected_modes = {
              "in-place-shared-mip1",
              "in-place-private-mip1",
          }
          if {
              candidate.get("mode")
              for candidate in in_place
              if isinstance(candidate, dict)
          } != expected_modes:
              raise SystemExit(
                  "schema-68 in-place downsample modes differ"
              )
          for candidate in in_place:
              if (
                  candidate.get("executed") is not True
                  or candidate.get(
                      "sourceAndDestinationAreSameTexture"
                  ) is not True
                  or candidate.get("sourceLevel") != 0
                  or candidate.get("destinationLevel") != 1
                  or candidate.get("mipmapLevelCount") != 2
                  or candidate.get("outputBytes") != 224 * 224 * 4
              ):
                  raise SystemExit(
                      "schema-68 in-place downsample failed: "
                      f"{candidate}"
                  )
              path = root / str(candidate.get("outputFile", ""))
              if (
                  not path.is_file()
                  or path.stat().st_size
                      != candidate.get("outputBytes")
              ):
                  raise SystemExit(
                      "schema-68 in-place payload differs: "
                      f"{path}"
                  )

          expected_sizes = {
              "carenderer-live-tree-glass-final-color-numeric-trace-rgba16f.raw":
                  1024 * 1024 * 8,
              "carenderer-live-tree-glass-color-stages-a-numeric-trace-rgba32ui.raw":
                  1024 * 1024 * 16,
              "carenderer-live-tree-glass-color-stages-b-numeric-trace-rgba32ui.raw":
                  1024 * 1024 * 16,
              "carenderer-live-tree-glass-sdf-numeric-trace-rgba16f.raw":
                  1024 * 1024 * 8,
              "carenderer-live-tree-glass-sdf-geometry-numeric-trace-rgba32ui.raw":
                  1024 * 1024 * 16,
              "carenderer-live-tree-glass-sdf-oval-numeric-trace-rgba32ui.raw":
                  1024 * 1024 * 16,
              "carenderer-live-tree-glass-sdf-normal-numeric-trace-rgba32ui.raw":
                  1024 * 1024 * 16,
              "carenderer-live-tree-glass-sdf-coverage-numeric-trace-rgba32ui.raw":
                  1024 * 1024 * 16,
              "half-blend-source-conversion-bgra8.raw":
                  256 * 124 * 4,
              "half-blend-alpha-destination-bgra8.raw":
                  1024 * 3841 * 4,
              "half-blend-combined-hash-bgra8.raw":
                  2048 * 2048 * 4,
          }
          for name, expected_size in expected_sizes.items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"missing numeric trace: {name}")
              if path.stat().st_size != expected_size:
                  raise SystemExit(
                      f"wrong numeric trace size for {name}: "
                      f"{path.stat().st_size} != {expected_size}"
                  )

          texture_evidence = runtime.get("carendererEvidence", {}).get(
              "metalTextureSnapshots", {}
          )
          copy_base_inputs = []
          source_candidates = []
          for snapshot in texture_evidence.get("snapshots", []):
              pipeline = snapshot.get("pipeline", {})
              descriptor = snapshot.get("pipeline", {}).get(
                  "creationDescriptor", {}
              )
              if (
                  pipeline.get("label")
                  == "com.apple.coreanimation."
                     "variable_blur_copy_base_mip_compute"
                  and snapshot.get("index") == 0
                  and snapshot.get("pixelFormat") == 80
                  and snapshot.get("width") == 448
                  and snapshot.get("height") == 448
                  and snapshot.get("mipmapLevelCount") == 1
              ):
                  copy_base_inputs.append(snapshot)
              if (
                  descriptor.get("fragmentFunction")
                  == "glass_background_sdf_no_bleed_lph"
                  and snapshot.get("index") == 3
                  and snapshot.get("pixelFormat") == 80
                  and snapshot.get("width") == 448
                  and snapshot.get("height") == 448
                  and snapshot.get("mipmapLevelCount") == 2
              ):
                  source_candidates.append(snapshot)
          if len(copy_base_inputs) != 1:
              raise SystemExit(
                  "schema-68 copy-base input texture is not unique: "
                  f"{len(copy_base_inputs)} candidates"
              )
          copy_base_input = copy_base_inputs[0]
          copy_base_path = root / str(
              copy_base_input.get("rawFile", "")
          )
          if (
              copy_base_input.get("rawCapture") is not True
              or copy_base_input.get("rawBytes")
                  != 448 * 448 * 4
              or not copy_base_path.is_file()
              or copy_base_path.stat().st_size
                  != 448 * 448 * 4
          ):
              raise SystemExit(
                  "schema-68 copy-base input payload differs: "
                  f"{copy_base_input}"
              )
          if len(source_candidates) != 1:
              raise SystemExit(
                  "schema-68 live backdrop source texture is not unique: "
                  f"{len(source_candidates)} candidates"
              )

          levels = {
              level.get("level"): level
              for level in source_candidates[0].get("mipSnapshots", [])
          }
          expected_levels = {
              0: (448, 448, 448 * 448 * 4),
              1: (224, 224, 224 * 224 * 4),
          }
          for level, (width, height, expected_size) in (
              expected_levels.items()
          ):
              record = levels.get(level)
              if (
                  not isinstance(record, dict)
                  or record.get("width") != width
                  or record.get("height") != height
                  or record.get("rawBytes") != expected_size
              ):
                  raise SystemExit(
                      f"schema-68 backdrop mip {level} metadata differs"
                  )
              path = root / str(record.get("rawFile", ""))
              if (
                  not path.is_file()
                  or path.stat().st_size != expected_size
              ):
                  raise SystemExit(
                      f"schema-68 backdrop mip {level} payload differs"
                  )

          mip_zero = (
              root / str(levels[0]["rawFile"])
          ).read_bytes()
          distinct_rgb = len({
              mip_zero[offset : offset + 3]
              for offset in range(0, len(mip_zero), 4)
          })
          if distinct_rgb < 50_000:
              raise SystemExit(
                  "schema-68 backdrop mip zero lacks identification rank: "
                  f"{distinct_rgb} distinct RGB texels"
              )
          PY
